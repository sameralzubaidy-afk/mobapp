# FLOW: trade-flow
# Purpose: E2E trade flow tests for TradeFlowV2 — Discover → Item Detail → Add to Cart → Cart
# Covers: TC-A01 (partial), TC-M01, TC-M02, TC-M08
# Seeds a test listing first, then logs in as buyer to interact with it

appId: com.sameralzubaidi.p2pmarketplace
---
- launchApp:
    clearState: true
- waitForAnimationToEnd

# ── Step 1: Seed a test listing (login as seller, create item) ──
- runFlow: helpers/tfv2-login-seller.yaml
- runFlow: helpers/tfv2-seed-listing.yaml

# ── Step 2: Stop app and restart as buyer (clearState:true clears seller session) ──
- stopApp
- launchApp:
    clearState: true
- waitForAnimationToEnd

# ── Login as buyer ──
- runFlow: helpers/tfv2-login-buyer.yaml

# ── Confirm login succeeded (authenticated stack loaded) ──
- assertVisible:
    id: "tab-discover"
- takeScreenshot: "01-after-login"

# ── Navigate to Discover tab ──
- tapOn:
    id: "tab-discover"
- waitForAnimationToEnd

# ── Wait for discover screen to load ──
- waitForAnimationToEnd
- waitForAnimationToEnd

# ── Check if discover screen loaded (either results or empty state) ──
- assertVisible:
    id: "discover-results-list"
    optional: true
- assertVisible:
    id: "empty-state"
    optional: true

# ── Tap search input and search for a known seeded item ──
- tapOn:
    id: "discover-search-input"
- waitForAnimationToEnd
- inputText: "Nintendo"
- waitForAnimationToEnd
- waitForAnimationToEnd

# ── Wait for search results ──
- extendedWaitUntil:
    visible:
      id: "search-result-"
    timeout: 20000

# ── If still no results, try tapping the retry/error banner ──
- runFlow:
    when:
      notVisible:
        id: "search-result-"
    commands:
      - tapOn:
          id: "network-error-banner"
          optional: true
      - waitForAnimationToEnd
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "search-result-"
          timeout: 15000

# ── If still no results, try clearing filters and searching again ──
- runFlow:
    when:
      notVisible:
        id: "search-result-"
    commands:
      - tapOn:
          id: "clear-filters-button"
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          id: "discover-search-input"
      - waitForAnimationToEnd
      - inputText: "Nintendo"
      - waitForAnimationToEnd
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "search-result-"
          timeout: 15000

# ── If still no results, try empty query (should show all) ──
- runFlow:
    when:
      notVisible:
        id: "search-result-"
    commands:
      - tapOn:
          id: "discover-search-input"
      - waitForAnimationToEnd
      - eraseText
      - waitForAnimationToEnd
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "search-result-"
          timeout: 15000

# ── If still no results, fail gracefully ──
- runFlow:
    when:
      notVisible:
        id: "search-result-"
    commands:
      - assertVisible:
          id: "empty-state"

# ── Tap first listing card ──
- tapOn:
    id: "search-result-"
    index: 0
- waitForAnimationToEnd

# ── Verify item detail screen loaded ──
- assertVisible:
    id: "item-detail-title"
- assertVisible:
    id: "item-detail-price"
- waitForAnimationToEnd

# ── Tap Add to Cart button ──
- tapOn:
    id: "add-to-cart-button"
- waitForAnimationToEnd

# ── Verify View Cart button appears (item was added) ──
- assertVisible:
    id: "view-cart-button"
- waitForAnimationToEnd

# ── Tap View Cart to navigate to Cart screen ──
- tapOn:
    id: "view-cart-button"
- waitForAnimationToEnd

# ── Verify Cart screen loaded with item ──
- assertVisible:
    id: "cart-summary"
- assertVisible:
    id: "checkout-button"
- waitForAnimationToEnd

# ── Navigate to Me tab ──
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- waitForAnimationToEnd

# ── Verify we're on profile screen ──
- runFlow:
    when:
      visible:
        id: "profile-trades-stat"
    commands:
      # ── Navigate to TradeListScreen from Me tab via profile trades stat ──
      - tapOn:
          id: "profile-trades-stat"
      - waitForAnimationToEnd

      # ── Verify trades screen loaded ──
      - assertVisible:
          id: "tab-active"
      - waitForAnimationToEnd

      # ── Check Active tab (shows pending/in-progress trades) ──
      - tapOn:
          id: "tab-active"
      - waitForAnimationToEnd

      # ── Check for existing trades ──
      - runFlow:
          when:
            visible:
              id: "trade-row-"
          commands:
            - tapOn:
                id: "trade-row-"
                index: 0
            - waitForAnimationToEnd
            # Verify trade detail screen elements
            - assertVisible:
                id: "trade-status-badge"
            - assertVisible:
                id: "mark-completed-button"
                optional: true
            - assertVisible:
                id: "cancel-trade-button"
                optional: true
            - takeScreenshot: "02-trade-detail"

      # ── Navigate back to Me tab ──
      - tapOn:
          id: "tab-me"
      - waitForAnimationToEnd

      # ── Verify profile screen ──
      - assertVisible:
          id: "profile-trades-stat"
      - waitForAnimationToEnd

- stopApp
