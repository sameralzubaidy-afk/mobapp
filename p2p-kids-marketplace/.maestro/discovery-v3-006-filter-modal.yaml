# FLOW: SearchFilterModal UI Flow | TASK: DISCOVERY-V3-006 | States covered: all 8 filter sections, price validation, clear all, apply
# MODULE-05-DISCOVERY-V3
# 
# Tests all filter sections in SearchFilterModal with various state combinations
#
# Preconditions:
# - User is logged in
# - At least 3 categories exist in the database
# - App is on Discover screen
#
# Flow coverage:
# 1. Open filter modal
# 2. Select filters from all 8 sections
# 3. Test price validation (invalid range)
# 4. Clear all filters
# 5. Apply valid filters
# 6. Verify filter chips appear in discover screen

appId: com.p2pkidsmarketplace.app
---

# ============================================
# SETUP: Navigate to Discover screen
# ============================================

- launchApp
- waitForAnimationToEnd

# Ensure we're logged in (if not, skip this flow)
- runFlow:
    when:
      notVisible: "Discover"
    commands:
      - tapOn: "Login"
      - inputText: "test-user@example.com"
      - tapOn: "Password"
      - inputText: "password123"
      - tapOn: "Sign In"
      - waitForAnimationToEnd

# Navigate to Discover tab
- tapOn:
    id: "discover-tab"
- waitForAnimationToEnd
- assertVisible: "Discover"

# ============================================
# TEST 1: Open Filter Modal
# ============================================

- tapOn:
    id: "discover-filter-button"
- waitForAnimationToEnd

# Verify modal header
- assertVisible: "Filters"
- assertVisible:
    id: "filter-modal-clear-all"
- assertVisible:
    id: "filter-modal-close"

# Verify all 8 section titles in order
- assertVisible: "CATEGORY"
- assertVisible: "CONDITION"
- assertVisible: "AGE GROUP"
- assertVisible: "GENDER"
- assertVisible: "COLOR"
- assertVisible: "BRAND"
- assertVisible: "PRICE RANGE"
- assertVisible: "SWAP POINTS ONLY"

# ============================================
# TEST 2: Select Category Filter (Multi-Select)
# ============================================

# Select first category
- tapOn:
    id: "filter-category-*"
    index: 0
- waitForAnimationToEnd

# Select second category
- tapOn:
    id: "filter-category-*"
    index: 1
- waitForAnimationToEnd

# Verify active filter count updates (should show "Filters (1)" since categories count as 1)
- assertVisible:
    text: "Filters \\(1\\)"

# ============================================
# TEST 3: Select Condition Filter (Single-Select)
# ============================================

- tapOn:
    id: "filter-condition-like_new"
- waitForAnimationToEnd

# Count should be 2 now (categories + condition)
- assertVisible:
    text: "Filters \\(2\\)"

# ============================================
# TEST 4: Select Age Group Filter
# ============================================

- tapOn:
    id: "filter-age-3-5"
- waitForAnimationToEnd

# Count should be 3
- assertVisible:
    text: "Filters \\(3\\)"

# ============================================
# TEST 5: Select Gender Filter
# ============================================

- tapOn:
    id: "filter-gender-boy"
- waitForAnimationToEnd

# Count should be 4
- assertVisible:
    text: "Filters \\(4\\)"

# ============================================
# TEST 6: Select Color Filter (Multi-Select)
# ============================================

# Scroll down to color section if needed
- scroll

- tapOn:
    id: "filter-color-blue"
- waitForAnimationToEnd

- tapOn:
    id: "filter-color-red"
- waitForAnimationToEnd

# Count should be 5 (colors count as 1 filter)
- assertVisible:
    text: "Filters \\(5\\)"

# ============================================
# TEST 7: Brand Filter (Text Input)
# ============================================

- scroll

- tapOn:
    id: "filter-brand-input"
- inputText: "LEGO"
- waitForAnimationToEnd

# Wait for autocomplete (200ms debounce)
- wait: 300

# If suggestions appear, tap one
- runFlow:
    when:
      visible:
        id: "brand-suggestion-0"
    commands:
      - tapOn:
          id: "brand-suggestion-0"
      - waitForAnimationToEnd

# Count should be 6
- assertVisible:
    text: "Filters \\(6\\)"

# ============================================
# TEST 8: Price Range Filter (Valid)
# ============================================

- scroll

# Select a preset first
- tapOn:
    id: "filter-price-preset-10-25"
- waitForAnimationToEnd

# Count should be 7
- assertVisible:
    text: "Filters \\(7\\)"

# ============================================
# TEST 9: Swap Points Toggle
# ============================================

- scroll

- tapOn:
    id: "filter-sp-toggle"
- waitForAnimationToEnd

# Count should be 8 (all filters active)
- assertVisible:
    text: "Filters \\(8\\)"

# ============================================
# TEST 10: Price Validation (Invalid Range)
# ============================================

- scroll

# Clear preset by entering custom range
- tapOn:
    id: "filter-price-min"
- inputText: "100"

- tapOn:
    id: "filter-price-max"
- inputText: "50"

- hideKeyboard

# Wait for validation
- waitForAnimationToEnd

# Verify error message appears
- assertVisible:
    id: "filter-price-error"
- assertVisible: "Min price must not exceed max price"

# Verify Apply button is disabled
- tapOn:
    id: "filter-modal-apply"
# If modal is still visible, apply was disabled (success)
- assertVisible: "Filters"

# ============================================
# TEST 11: Fix Price Range (Make it Valid)
# ============================================

- scroll

- tapOn:
    id: "filter-price-max"
- clearText
- inputText: "150"
- hideKeyboard

# Wait for validation to clear error
- waitForAnimationToEnd

# Error should be gone
- assertNotVisible:
    id: "filter-price-error"

# ============================================
# TEST 12: Clear All Filters
# ============================================

- swipe:
    direction: UP

- tapOn:
    id: "filter-modal-clear-all"
- waitForAnimationToEnd

# Verify count is back to 0
- assertVisible: "Filters"
- assertNotVisible:
    text: "Filters \\([1-9]\\)"

# ============================================
# TEST 13: Re-apply Some Filters and Apply
# ============================================

# Select condition again
- tapOn:
    id: "filter-condition-new"
- waitForAnimationToEnd

# Select age group
- scroll
- tapOn:
    id: "filter-age-6-8"
- waitForAnimationToEnd

# Verify count
- assertVisible:
    text: "Filters \\(2\\)"

# Apply filters
- tapOn:
    id: "filter-modal-apply"
- waitForAnimationToEnd

# ============================================
# TEST 14: Verify Filters Applied in Discover Screen
# ============================================

# Modal should be closed
- assertNotVisible: "Filters"

# Should be back on Discover screen
- assertVisible: "Discover"

# Filter button should show count
- assertVisible:
    id: "discover-filter-button"

# Filter chips should be visible (implementation-dependent)
# Note: This assumes ActiveFilterChips component exists and renders
- runFlow:
    when:
      visible:
        id: "active-filter-chip-*"
    commands:
      - assertVisible:
          id: "active-filter-chip-*"

# ============================================
# TEST 15: Re-open Modal (Filters Should Persist)
# ============================================

- tapOn:
    id: "discover-filter-button"
- waitForAnimationToEnd

# Verify previously selected filters are still selected
- assertVisible:
    id: "filter-condition-new"
    # Should have selected state (implementation-dependent)

- assertVisible:
    id: "filter-age-6-8"
    # Should have selected state

# Close modal without changing
- tapOn:
    id: "filter-modal-close"
- waitForAnimationToEnd

# ============================================
# FINAL ASSERTION
# ============================================

# Should be back on Discover screen
- assertVisible: "Discover"

# Test passed - all filter sections work correctly
