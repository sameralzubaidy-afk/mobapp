# FLOW: module-15.1.2-flow-08-trade-v2-components
# Purpose: Trade v2 component tests — login → Me → Trades → Trade Detail → Verify status badge
# Covers: TC-D01-D05 (partial)

appId: com.sameralzubaidi.p2pmarketplace
---
- launchApp:
    clearState: true
- waitForAnimationToEnd

# ── Step 1: Seed a test listing (login as seller, create item) ──
- runFlow: helpers/tfv2-login-seller.yaml
- runFlow: helpers/tfv2-seed-listing.yaml

# ── Step 2: Stop app and restart as buyer (clearState:true clears seller session) ──
- stopApp
- launchApp:
    clearState: true
- waitForAnimationToEnd
- runFlow: helpers/tfv2-login-buyer.yaml

# ── Login as buyer ──
- runFlow:
    when:
      visible:
        id: "login-email-input"
    commands:
      - tapOn:
          id: "login-email-input"
      - eraseText
      - inputText: "test-buyer@kidsmarketplace.test"
      # Tap twice: first tap dismisses iOS autofill, second focuses field
      - tapOn:
          id: "login-password-input"
      - tapOn:
          id: "login-password-input"
      - eraseText
      - inputText: "TestBuyer123!"
      # Tap submit button directly (keyboard dismisses automatically)
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd

# iOS save-password sheet may appear.
- runFlow:
    when:
      visible:
        text: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

# ── Confirm login succeeded (authenticated stack loaded) ──
- assertVisible:
    id: "tab-discover"
- takeScreenshot: "01-after-login"

# ── Navigate to Me tab ──
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- waitForAnimationToEnd

# ── Navigate to TradeListScreen from Me tab via profile trades stat ──
- runFlow:
    when:
      visible:
        id: "profile-trades-stat"
    commands:
      - tapOn:
          id: "profile-trades-stat"
      - waitForAnimationToEnd

      # ── Verify trades screen ──
      - assertVisible:
          id: "tab-active"
      - waitForAnimationToEnd

      # ── Check Active tab (shows pending/in-progress trades) ──
      - tapOn:
          id: "tab-active"
      - waitForAnimationToEnd

      # ── Check for existing trades and verify timer/dispute components ──
      - runFlow:
          when:
            visible:
              id: "trade-row-"
          commands:
            - tapOn:
                id: "trade-row-"
                index: 0
            - waitForAnimationToEnd
            # Verify trade detail screen elements
            - assertVisible:
                id: "trade-status-badge"
            - takeScreenshot: "02-trade-detail"

