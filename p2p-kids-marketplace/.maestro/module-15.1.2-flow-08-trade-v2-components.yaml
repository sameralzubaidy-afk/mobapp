# FLOW: module-15.1.2-flow-08-trade-v2-components
# Purpose: Trade v2 component tests — login → Me → Trades → Trade Detail → Verify status badge
# Covers: TC-D01-D05 (partial)

appId: com.sameralzubaidi.p2pmarketplace
---
- launchApp:
    clearState: false
- waitForAnimationToEnd

# ── Step 1: Seed a test listing (login as seller, create item) ──
- runFlow: helpers/tfv2-login-seller.yaml
- runFlow: helpers/tfv2-seed-listing.yaml

# ── Step 2: Stop app and restart as buyer ──
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- runFlow: helpers/tfv2-login-buyer.yaml

# ── Login as buyer ──
- runFlow:
    when:
      visible:
        id: "login-email-input"
    commands:
      - tapOn:
          id: "login-email-input"
      - eraseText
      - inputText: "test-buyer@kidsmarketplace.test"
      - tapOn:
          id: "login-password-input"
      - eraseText
      - inputText: "TestBuyer123!"
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd

# ── Navigate to Me tab ──
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- waitForAnimationToEnd

# ── Navigate to TradeListScreen from Me tab via profile trades stat ──
- runFlow:
    when:
      visible:
        id: "profile-trades-stat"
    commands:
      - tapOn:
          id: "profile-trades-stat"
      - waitForAnimationToEnd

      # ── Verify trades screen ──
      - assertVisible:
          id: "tab-buying"
      - waitForAnimationToEnd

      # ── Check Buying tab ──
      - tapOn:
          id: "tab-buying"
      - waitForAnimationToEnd

      # ── Check for existing trades and verify timer/dispute components ──
      - runFlow:
          when:
            visible:
              id: "trade-row-"
          commands:
            - tapOn:
                id: "trade-row-"
                index: 0
            - waitForAnimationToEnd
            # Verify trade detail screen elements
            - assertVisible:
                id: "trade-status-badge"

