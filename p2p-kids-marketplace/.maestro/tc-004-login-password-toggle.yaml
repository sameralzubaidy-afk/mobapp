# FLOW: TC-004 Login Password Visibility Toggle
# Scope: MODULE-15.1 FLOW-01 manual test case TC-004 only
# Platform: iOS (Expo Go)

appId: host.exp.Exponent
---
- runFlow:
    file: helpers/auth-bootstrap-expo.yaml

# Navigate to Login from Landing
- runFlow:
    when:
      visible:
        id: landing-login-button
    commands:
      - tapOn:
          id: landing-login-button
- assertVisible:
    id: login-password-input

# Enter password, then toggle visibility twice
- tapOn:
    id: login-password-input
- inputText: test123
- tapOn:
    id: login-password-input-toggle-button
- tapOn:
    id: login-password-input-toggle-button

# Basic postcondition: login form still visible and functional
- assertVisible:
    id: login-submit-button
