# FLOW: tfv2-dismiss-system-dialogs
# Purpose: Dismiss all known system and app-level interrupters at script start.
# Called via: runFlow: helpers/tfv2-dismiss-system-dialogs.yaml
# This must be the FIRST runFlow call after launchApp in every script.

appId: com.sameralzubaidi.p2pmarketplace
---
# ═══════════════════════════════════════════════════════════════════════
# CLASS 4 DEFENSE — Unexpected System / App Dialogs
# Dismisses all known interrupters before any navigation begins.
# ═══════════════════════════════════════════════════════════════════════

# ── iOS Save Password sheet ───────────────────────────────────────────
- runFlow:
    when:
      visible:
        text: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

# ── iOS Update Password / Use Existing? sheet ────────────────────────
- runFlow:
    when:
      visible:
        text: "Use Existing?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

# ── iOS Sign in with Apple ───────────────────────────────────────────
- runFlow:
    when:
      visible:
        text: "Sign in with Apple"
    commands:
      - tapOn:
          text: "Cancel"
      - waitForAnimationToEnd

# ── Push notification permission ────────────────────────────────────
- runFlow:
    when:
      visible:
        text: "Allow Notifications"
    commands:
      - tapOn:
          text: "Don't Allow"
      - waitForAnimationToEnd

# ── iOS Pasteboard paste confirmation ────────────────────────────────
- runFlow:
    when:
      visible:
        text: "Paste from"
    commands:
      - tapOn:
          text: "Allow Paste"
      - waitForAnimationToEnd

# ── Android system ANR dialog ("… isn't responding") ─────────────────
# Android shows a MODAL system dialog when any app stops responding — most often
# an unrelated system app (e.g. Digital Wellbeing) on a loaded emulator.
# Verified 2026-09-10 on the Android leg of the Group D run: the flow started
# while "Digital Wellbeing isn't responding / Close app / Wait" covered the Expo
# dev launcher, so the launcher row was never visible, every conditional step was
# skipped and the flow died at the post-login `tab-discover` assert. Tap "Wait"
# (not "Close app" — that force-closes the app under test) and carry on.
- runFlow:
    when:
      visible:
        text: ".*isn't responding"
    commands:
      - tapOn:
          text: "Wait"
      - waitForAnimationToEnd

# ── Expo dev-client launcher (fresh launch / clearState) ─────────────
# After clearState the dev build shows the "Development servers" launcher
# (Pass It Up! / DEVELOPMENT SERVERS / <host>:8081) instead of auto-connecting
# to Metro. Tap the server entry to load the JS bundle so the
# Welcome/Landing/Login screens can appear. Conditional + safe: no-op when the
# launcher isn't shown.
#
# FIX-Task-12 item 2 — the matcher matches the server row on ANY host:
#   iOS simulator:     http://localhost:8081
#   Android emulator:  http://10.0.2.2:8081  (the emulator's host-loopback alias)
# The previous exact-string matcher only matched `http://localhost:8081`, so on
# Android the launcher was never dismissed and the flow died on that screen.
#
# POLLED (repeat 6×): on the Android emulator the launcher's server row renders
# several seconds after `launchApp clearState:true` returns, so a single
# `when visible` check right after the launch silently skipped the tap and the
# flow died on the launcher — verified 2026-09-10 (Android leg of the Group D
# run, failure frame showing the launcher with http://10.0.2.2:8081). Each
# iteration is a no-op once the launcher is gone.
- repeat:
    times: 6
    commands:
      # Re-check the ANR dialog each iteration — it can appear mid-poll.
      - runFlow:
          when:
            visible:
              text: ".*isn't responding"
          commands:
            - tapOn:
                text: "Wait"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: ".*(localhost|10\\.0\\.2\\.2).*8081.*"
          commands:
            - tapOn:
                text: ".*(localhost|10\\.0\\.2\\.2).*8081.*"
            - waitForAnimationToEnd
            # FIX-Task-14 (2026-09-10) — WAIT for the ONE thing that is both
            # guaranteed to appear after a cold launch AND is itself what blocks
            # the app: the one-time developer-menu onboarding sheet.
            #
            # Why NOT wait for the launcher to disappear — that is the FIX-Task-12
            # shape AND this task's first two attempts, both of which left iOS RED:
            #   (a) the launcher STAYS in the AX hierarchy BEHIND that sheet (a
            #       modal does not remove the view beneath it), so a `notVisible`
            #       keyed on ANY launcher text can never be satisfied and burns
            #       its whole timeout — verified in run 2026-09-10T19-38-42
            #       ("Assertion is false: ... is not visible", 1m19s ×2);
            #   (b) deleting the wait outright is no better: the next bare
            #       `when visible` poll crashed the XCUITest driver mid-transition
            #       (viewHierarchy → kAXErrorInvalidUIElement, HTTP 500), and a
            #       bare `when visible` inside a `repeat:` hard-fails the flow —
            #       verified in run 2026-09-10T19-19-01.
            # `extendedWaitUntil` retries driver errors; a bare `when visible`
            # does not. The sheet reliably reappears after EVERY clearState launch
            # (clearState wipes the "onboarding already seen" flag), and this block
            # only runs when the launcher row was actually tapped — i.e. exactly
            # that cold-launch path. Do NOT revert this to a `notVisible` wait
            # keyed on the launcher or on any `8081` text.
            - extendedWaitUntil:
                visible:
                  text: "This is the developer menu.*"
                timeout: 45000
            - waitForAnimationToEnd
      - waitForAnimationToEnd

# ── Expo developer-menu onboarding sheet + the dev menu itself ────────
# FIX-Task-12 item 1 (continued) — after the JS bundle loads, a dev-client build
# presents the ONE-TIME developer-menu onboarding sheet ("This is the developer
# menu…" + [Continue]) ON TOP OF THE APP. Because `launchApp clearState:true`
# wipes the app data that records "onboarding already seen", it reappears after
# EVERY clearState launch — the flow then failed the post-login `tab-discover`
# assertion while the sheet was covering the screen.
#
# Empirically verified (2026-09-10):
#   * tapping [Continue] dismisses the onboarding sheet but LEAVES THE DEV MENU
#     OPEN (showing "Reload / Go home / TOOLS / Fast refresh");
#   * a swipe DOWN on that menu closes it and reveals the app behind it —
#     verified on BOTH iPhone 16 Pro E2E (iOS 26.5) AND the Android emulator.
# Poll a few times (the sheet can appear a moment after the bundle loads); every
# step is a conditional no-op when nothing is shown, so a warm launch or an
# already-dismissed menu passes straight through.
#
# The "dev menu is open" detector is `.*[Pp]erformance monitor.*` — a dev-menu-only
# label that can never match the app's own UI. The label differs per platform
# (iOS: "Toggle performance monitor"; Android: "Performance monitor"), so the
# iOS-only string first used here never fired on Android and the flow died with
# the menu still open (verified 2026-09-10, Android leg of the Group D run).
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible:
              text: "This is the developer menu.*"
          commands:
            - tapOn:
                text: "Continue"
            - waitForAnimationToEnd
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: ".*[Pp]erformance monitor.*"
          commands:
            - swipe:
                direction: DOWN
                duration: 700
            - waitForAnimationToEnd
            - waitForAnimationToEnd
      - waitForAnimationToEnd

# ── App-level Welcome screen ─────────────────────────────────────────
- runFlow:
    when:
      visible:
        id: "welcome-get-started-button"
    commands:
      - tapOn:
          id: "welcome-get-started-button"
      - waitForAnimationToEnd

# ── Keyboard dismiss (catch-all, iOS only) ────────────────────────────
# FIX-Task-12: was a bare `- hideKeyboard`, which is unsafe on BOTH platforms:
#   iOS     → HARD-FAILS on this build's custom TextInputs ("Couldn't hide the
#             keyboard…") and aborted any caller that ran this helper right
#             after a login;
#   Android → sends a BACK key event and, with no soft keyboard up (hardware
#             keyboard emulator), BACK EXITS THE APP to the device home screen
#             (verified 2026-09-10 on the Android leg of the Group D run).
# Only the iOS accessory tap is kept, guarded — a no-op when it isn't shown.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible:
              id: "keyboard-done-button"
          commands:
            - tapOn:
                id: "keyboard-done-button"
            - waitForAnimationToEnd
