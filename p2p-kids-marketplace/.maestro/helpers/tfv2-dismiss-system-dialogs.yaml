# FLOW: tfv2-dismiss-system-dialogs
# Purpose: Dismiss all known system and app-level interrupters at script start.
# Called via: runFlow: helpers/tfv2-dismiss-system-dialogs.yaml
# This must be the FIRST runFlow call after launchApp in every script.

appId: com.sameralzubaidi.p2pmarketplace
---
# ═══════════════════════════════════════════════════════════════════════
# CLASS 4 DEFENSE — Unexpected System / App Dialogs
# Dismisses all known interrupters before any navigation begins.
# ═══════════════════════════════════════════════════════════════════════

# ── iOS Save Password sheet ───────────────────────────────────────────
- runFlow:
    when:
      visible:
        text: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

# ── iOS Update Password / Use Existing? sheet ────────────────────────
- runFlow:
    when:
      visible:
        text: "Use Existing?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

# ── iOS Sign in with Apple ───────────────────────────────────────────
- runFlow:
    when:
      visible:
        text: "Sign in with Apple"
    commands:
      - tapOn:
          text: "Cancel"
      - waitForAnimationToEnd

# ── Push notification permission ────────────────────────────────────
- runFlow:
    when:
      visible:
        text: "Allow Notifications"
    commands:
      - tapOn:
          text: "Don't Allow"
      - waitForAnimationToEnd

# ── iOS Pasteboard paste confirmation ────────────────────────────────
- runFlow:
    when:
      visible:
        text: "Paste from"
    commands:
      - tapOn:
          text: "Allow Paste"
      - waitForAnimationToEnd

# ── Expo dev-client launcher (fresh launch / clearState) ─────────────
# After clearState the dev build shows the "Development servers" launcher
# (Pass It Up! / DEVELOPMENT SERVERS / http://localhost:8081) instead of
# auto-connecting to Metro. Tap the server entry to load the JS bundle so
# the Welcome/Landing/Login screens can appear. Conditional + safe: no-op
# when the launcher isn't shown.
- runFlow:
    when:
      visible:
        text: "http://localhost:8081"
    commands:
      - tapOn:
          text: "http://localhost:8081"
      - waitForAnimationToEnd
      - waitForAnimationToEnd

# ── App-level Welcome screen ─────────────────────────────────────────
- runFlow:
    when:
      visible:
        id: "welcome-get-started-button"
    commands:
      - tapOn:
          id: "welcome-get-started-button"
      - waitForAnimationToEnd

# ── iOS Keyboard Dismiss (catch-all) ─────────────────────────────────
- hideKeyboard
- waitForAnimationToEnd
