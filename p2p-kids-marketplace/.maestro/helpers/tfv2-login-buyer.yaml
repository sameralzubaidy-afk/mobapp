# FLOW: tfv2-login-buyer
# Purpose: Deterministic login prerequisite for Maestro flows.
# Logs in as test-buyer@kidsmarketplace.test

appId: com.sameralzubaidi.p2pmarketplace
---
- waitForAnimationToEnd

# Handle Welcome screen if shown.
- runFlow:
    when:
      visible:
        id: "welcome-get-started-button"
    commands:
      - tapOn:
          id: "welcome-get-started-button"
      - waitForAnimationToEnd

# Handle Landing screen if shown.
- runFlow:
    when:
      visible:
        id: "landing-login-button"
    commands:
      - tapOn:
          id: "landing-login-button"
      - waitForAnimationToEnd

# Attempt login when login form is visible.
- runFlow:
    when:
      visible:
        id: "login-email-input"
    commands:
      - tapOn:
          id: "login-email-input"
      - waitForAnimationToEnd
      - eraseText
      - inputText: "test-buyer@kidsmarketplace.test"

      # Tap password field twice: first tap dismisses iOS autofill suggestion,
      # second tap actually focuses the password field
      - tapOn:
          id: "login-password-input"
      - waitForAnimationToEnd
      - tapOn:
          id: "login-password-input"
      - waitForAnimationToEnd
      - eraseText
      - inputText: "TestBuyer123!"

      # Class 1: hideKeyboard before submit (keyboard/autofill overlay blocks the tap)
      - hideKeyboard
      - waitForAnimationToEnd
      # Class 1: scrollUntilVisible to ensure button is on screen
      - scrollUntilVisible:
          element:
            id: "login-submit-button"
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd
      - waitForAnimationToEnd                      # Double wait: transition + auth

# Retry submit once if still on login screen (also hardened).
- runFlow:
    when:
      visible:
        id: "login-email-input"
    commands:
      # Class 1: hideKeyboard before retry submit
      - hideKeyboard
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            id: "login-submit-button"
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd
      - waitForAnimationToEnd

# iOS save-password sheet may appear.
- runFlow:
    when:
      visible:
        text: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

# Class 3: Accept/dismiss the Terms of Service / Privacy Policy soft-gate (J05)
# if it appears after login for a returning user who hasn't accepted the current
# published policy version. Conditional + safe: no-op when the gate isn't shown.
# NOTE: runFlow paths resolve relative to THIS file (inside .maestro/helpers/),
# so the sibling helper is referenced by bare filename (no helpers/ prefix).
- runFlow: tfv2-accept-policy-gate.yaml

# Class 4: Assert login result — confirm authenticated stack loaded
- extendedWaitUntil:
    visible:
      id: "tab-discover"
    timeout: 20000
- takeScreenshot: "CHECKPOINT-buyer-logged-in"
