# FLOW: tfv2-login-buyer
# Purpose: Deterministic login prerequisite for Maestro flows.
# Logs in as test-buyer@kidsmarketplace.test

appId: com.sameralzubaidi.p2pmarketplace
---
- waitForAnimationToEnd

# Handle Welcome screen if shown.
- runFlow:
    when:
      visible:
        id: "welcome-get-started-button"
    commands:
      - tapOn:
          id: "welcome-get-started-button"
      - waitForAnimationToEnd

# Handle Landing screen if shown.
- runFlow:
    when:
      visible:
        id: "landing-login-button"
    commands:
      - tapOn:
          id: "landing-login-button"
      - waitForAnimationToEnd

# Attempt login when login form is visible.
- runFlow:
    when:
      visible:
        id: "login-email-input"
    commands:
      - tapOn:
          id: "login-email-input"
      - waitForAnimationToEnd
      - eraseText
      - inputText: "test-buyer@kidsmarketplace.test"

      # Tap password field twice: first tap dismisses iOS autofill suggestion,
      # second tap actually focuses the password field
      - tapOn:
          id: "login-password-input"
      - waitForAnimationToEnd
      - tapOn:
          id: "login-password-input"
      - waitForAnimationToEnd
      - eraseText
      - inputText: "TestBuyer123!"

      # Class 1: hideKeyboard before submit (keyboard/autofill overlay blocks the tap)
      - hideKeyboard
      - waitForAnimationToEnd
      # Class 1: scrollUntilVisible to ensure button is on screen
      - scrollUntilVisible:
          id: "login-submit-button"
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd
      - waitForAnimationToEnd                      # Double wait: transition + auth

# Retry submit once if still on login screen (also hardened).
- runFlow:
    when:
      visible:
        id: "login-email-input"
    commands:
      # Class 1: hideKeyboard before retry submit
      - hideKeyboard
      - waitForAnimationToEnd
      - scrollUntilVisible:
          id: "login-submit-button"
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd
      - waitForAnimationToEnd

# iOS save-password sheet may appear.
- runFlow:
    when:
      visible:
        text: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

# Class 3: Assert login result — confirm authenticated stack loaded
- assertVisible:
    id: "tab-discover"
    timeout: 15000
- takeScreenshot: "CHECKPOINT-buyer-logged-in"
  enabled: ${SCREENSHOTS_ENABLED}
