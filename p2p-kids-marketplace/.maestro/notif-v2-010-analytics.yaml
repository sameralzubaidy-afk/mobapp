# FLOW: Notification Analytics Tracking | TASK: NOTIF-V2-010 | States covered: delivered, opened, clicked, failed, metrics display

appId: com.kidsp2p.marketplace
---

# =========================================
# PRECONDITIONS: Test user logged in, notifications enabled
# =========================================

- launchApp:
    clearState: true

- tapOn:
    id: "login-email-input"
- inputText: "${TEST_USER_EMAIL}"

- tapOn:
    id: "login-password-input"
- inputText: "${TEST_USER_PASSWORD}"

- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

- assertVisible:
    id: "home-screen"

# =========================================
# STATE 1: Notification delivered tracking
# =========================================

- runFlow:
    when:
      visible:
        id: "settings-tab"
    commands:
      - tapOn:
          id: "settings-tab"
      - waitForAnimationToEnd
      - assertVisible:
          id: "settings-screen"

# Trigger a test notification (SP earned)
- tapOn:
    id: "test-notification-button"
    enabled: true

- waitForAnimationToEnd

# Notification should be delivered
- assertVisible:
    text: "Notification Sent"

# Verify analytics tracking (open admin dashboard on web)
# Note: This is a mobile flow, admin verification is manual

# =========================================
# STATE 2: Notification opened tracking
# =========================================

# Wait for notification to appear in notification center
- tapOn:
    id: "notifications-tab"

- waitForAnimationToEnd

- assertVisible:
    id: "notifications-screen"

# Find and tap the test notification
- tapOn:
    id: "notification-item-0"

- waitForAnimationToEnd

# Verify notification details screen opened
- assertVisible:
    id: "notification-details-screen"

# This action should track "opened" event in analytics

# =========================================
# STATE 3: Notification clicked with deep link
# =========================================

# Go back to notifications
- back

- waitForAnimationToEnd

# Send a notification with deep link
- tapOn:
    id: "settings-tab"

- waitForAnimationToEnd

- tapOn:
    id: "test-deeplink-notification-button"

- waitForAnimationToEnd

- assertVisible:
    text: "Deep Link Notification Sent"

# Tap the notification from notification center
- tapOn:
    id: "notifications-tab"

- waitForAnimationToEnd

- tapOn:
    id: "notification-item-0"

- waitForAnimationToEnd

# Verify deep link navigation occurred
- assertVisible:
    id: "sp-wallet-screen"

# This action should track "clicked" event with deep link

# =========================================
# STATE 4: Failed notification tracking
# =========================================

# This state is typically tested in E2E tests with invalid push tokens
# Manual verification: Check notification_events table for failed events

# =========================================
# FINAL ASSERTION: Verify analytics data exists
# =========================================

# Navigate back to home
- back
- back

- waitForAnimationToEnd

- assertVisible:
    id: "home-screen"

# =========================================
# SUCCESS CRITERIA
# =========================================
# - Delivered event tracked when notification sent
# - Opened event tracked when notification tapped
# - Clicked event tracked when deep link followed
# - Failed events logged for invalid tokens
# - Admin dashboard displays correct metrics
