# FLOW: trade-tfv2-023-addenda
# Purpose: Seller-side trade flows — login as seller → Selling tab → Trade Detail → Verify actions
# Covers: TC-J01-J05, TC-K01-K03

appId: com.sameralzubaidi.p2pmarketplace
---
- launchApp:
    clearState: true
- waitForAnimationToEnd

# ── Step 1: Seed a test listing (login as seller, create item) ──
- runFlow: helpers/tfv2-login-seller.yaml
- runFlow: helpers/tfv2-seed-listing.yaml

# ── Login as seller ──
- runFlow:
    when:
      visible:
        id: "login-email-input"
    commands:
      - tapOn:
          id: "login-email-input"
      - eraseText
      - inputText: "test-seller@kidsmarketplace.test"
      # Tap twice: first tap dismisses iOS autofill, second focuses field
      - tapOn:
          id: "login-password-input"
      - tapOn:
          id: "login-password-input"
      - eraseText
      - inputText: "TestSeller123!"
      # Tap submit button directly (keyboard dismisses automatically)
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd

# iOS save-password sheet may appear.
- runFlow:
    when:
      visible:
        text: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

# ── Confirm login succeeded (authenticated stack loaded) ──
- assertVisible:
    id: "tab-me"
- takeScreenshot: "01-after-login"

# ── Navigate to Me tab ──
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- waitForAnimationToEnd

# ── Navigate to TradeListScreen from Me tab via profile trades stat ──
- runFlow:
    when:
      visible:
        id: "profile-trades-stat"
    commands:
      - tapOn:
          id: "profile-trades-stat"
      - waitForAnimationToEnd

      # ── Verify trades screen loaded (unified Active/History tabs) ──
      - assertVisible:
          id: "tab-active"
      - waitForAnimationToEnd

      # ── Stay on Active tab (shows all active trades, both buying + selling) ──
      - tapOn:
          id: "tab-active"
      - waitForAnimationToEnd

      # ── Check for existing trades ──
      - runFlow:
          when:
            visible:
              id: "trade-row-"
          commands:
            - tapOn:
                id: "trade-row-"
                index: 0
            - waitForAnimationToEnd
            # Verify seller-side trade detail elements
            - assertVisible:
                id: "trade-status-badge"
            - assertVisible:
                id: "mark-completed-button"
                optional: true
            - assertVisible:
                id: "cancel-trade-button"
                optional: true
            - takeScreenshot: "02-trade-detail"

      # ── Navigate back to Me tab ──
      - tapOn:
          id: "tab-me"
      - waitForAnimationToEnd

- stopApp
