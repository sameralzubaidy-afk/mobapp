# FLOW: auth-login
# Screens: LoginScreen → HomeScreen/Dashboard
# testIDs required: login-email-input, login-password-input, login-submit-button
# Description: STRICT: Login form and failed-auth behavior verification

appId: com.anonymous.p2p-kids-marketplace
---
- launchApp
- openLink: 'com.anonymous.p2p-kids-marketplace://expo-development-client/?url=http://127.0.0.1:8081'
- waitForAnimationToEnd

# Setup normalization: if already authenticated, force logout first
- runFlow:
    when:
      visible:
        id: nav-profile
    commands:
      - tapOn:
          id: nav-profile
      - waitForAnimationToEnd
      - tapOn:
          id: profile-logout-button
      - waitForAnimationToEnd
      - tapOn:
          text: Logout
      - waitForAnimationToEnd

# Setup normalization: support Landing or direct Login start
- runFlow:
    when:
      visible:
        id: landing-login-button
    commands:
      - tapOn:
          id: landing-login-button
      - waitForAnimationToEnd

# Strict login form assertions
- assertVisible:
    id: login-email-input
- assertVisible:
    id: login-password-input
- assertVisible:
    id: login-submit-button

# Submit deterministic invalid credentials
- tapOn:
    id: login-email-input
- inputText: 'invalid-login-user@example.com'
- tapOn:
    id: login-password-input
- inputText: 'DefinitelyWrongPassword123!'
- hideKeyboard
- tapOn:
    id: login-submit-button
- waitForAnimationToEnd

# Strict postcondition: error alert is shown
- assertVisible:
    text: Login Failed
