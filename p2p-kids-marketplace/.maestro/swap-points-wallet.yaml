# FLOW: swap-points-wallet
# Purpose: SP wallet smoke coverage — login → Me tab → Verify SP balance stat
# Covers: REG-R06, REG-R07

appId: com.sameralzubaidi.p2pmarketplace
---
- launchApp:
    clearState: false
- waitForAnimationToEnd
- runFlow: helpers/tfv2-login-buyer.yaml

# Optional login path.
- runFlow:
    when:
      visible:
        id: "login-email-input"
    commands:
      - tapOn:
          id: "login-email-input"
      - eraseText
      - inputText: "test-buyer@kidsmarketplace.test"
      - tapOn:
          id: "login-password-input"
      - eraseText
      - inputText: "TestBuyer123!"
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd

# Navigate to Me tab
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify SP balance stat on profile
- runFlow:
    when:
      visible:
        id: "profile-sp-balance-stat"
    commands:
      - assertVisible:
          id: "profile-sp-balance-stat"

- stopApp
