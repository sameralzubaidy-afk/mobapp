# FLOW: module-15.1-flow-22-payouts
# Purpose: Payout E2E tests — login as seller → Me → Trades → Selling tab → Trade Detail
# Covers: TC-F01, TC-F02, TC-F03

appId: com.sameralzubaidi.p2pmarketplace
---
- launchApp:
    clearState: false
- waitForAnimationToEnd

# ── Step 1: Seed a test listing (login as seller, create item) ──
- runFlow: helpers/tfv2-login-seller.yaml
- runFlow: helpers/tfv2-seed-listing.yaml

# ── Login as seller ──
- runFlow:
    when:
      visible:
        id: "login-email-input"
    commands:
      - tapOn:
          id: "login-email-input"
      - eraseText
      - inputText: "test-seller@kidsmarketplace.test"
      - tapOn:
          id: "login-password-input"
      - eraseText
      - inputText: "TestSeller123!"
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd

# ── Navigate to Me tab ──
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- waitForAnimationToEnd

# ── Navigate to TradeListScreen from Me tab via profile trades stat ──
- runFlow:
    when:
      visible:
        id: "profile-trades-stat"
    commands:
      - tapOn:
          id: "profile-trades-stat"
      - waitForAnimationToEnd

      # ── Verify trades screen loaded ──
      - assertVisible:
          id: "tab-selling"
      - waitForAnimationToEnd

      # ── Check Selling tab ──
      - tapOn:
          id: "tab-selling"
      - waitForAnimationToEnd

      # ── Check for existing trades and verify payout-related elements ──
      - runFlow:
          when:
            visible:
              id: "trade-row-"
          commands:
            - tapOn:
                id: "trade-row-"
                index: 0
            - waitForAnimationToEnd
            # Verify trade detail screen elements
            - assertVisible:
                id: "trade-status-badge"

- stopApp
