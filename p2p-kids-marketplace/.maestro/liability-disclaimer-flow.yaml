# Purpose: Safety UX E2E tests — login → Me → Settings → Liability Disclaimer
# Covers: TC-I01, TC-I02, TC-I03, TC-I04, TC-I05

appId: com.sameralzubaidi.p2pmarketplace
---
- launchApp:
    clearState: false
- waitForAnimationToEnd
- runFlow: helpers/tfv2-login-buyer.yaml

# ── Login as buyer ──
- runFlow:
    when:
      visible:
        id: "login-email-input"
    commands:
      - tapOn:
          id: "login-email-input"
      - eraseText
      - inputText: "test-buyer@kidsmarketplace.test"
      # Tap twice: first tap dismisses iOS autofill, second focuses field
      - tapOn:
          id: "login-password-input"
      - tapOn:
          id: "login-password-input"
      - eraseText
      - inputText: "TestBuyer123!"
      # Tap submit button directly (keyboard dismisses automatically)
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd

# ── Navigate to Me tab ──
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- waitForAnimationToEnd

# ── Navigate to Settings from Me tab ──
- runFlow:
    when:
      visible:
        id: "profile-settings"
    commands:
      - tapOn:
          id: "profile-settings"
      - waitForAnimationToEnd

      # ── Navigate to Liability Disclaimer ──
      - tapOn:
          id: "settings-liability-disclaimer-button"
      - waitForAnimationToEnd

      # ── Verify liability disclaimer screen ──
      - assertVisible:
          text: "Liability Disclaimer"

- stopApp
