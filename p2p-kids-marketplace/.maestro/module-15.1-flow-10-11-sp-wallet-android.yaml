# FLOW: SP Wallet & Transaction History | TASK: MODULE-15.1 FLOW-10/11 | States covered: Loaded, Empty/With Transactions, Tab Filtering

appId: host.exp.exponent
---
# Deterministic app bootstrap in Expo Go.
- stopApp
- waitForAnimationToEnd
- launchApp
- openLink: exp://127.0.0.1:8081
- waitForAnimationToEnd

# If Expo Go opens the recent project card, tap it.
- runFlow:
        when:
            visible:
                text: p2p-kids-marketplace
        commands:
            - tapOn:
                    text: p2p-kids-marketplace
            - waitForAnimationToEnd

# Allow Expo bundle download/initialization to settle before route actions.
- waitForAnimationToEnd:
    timeout: 60000

# Dismiss iOS credential prompt if present.
- runFlow:
        when:
            visible:
                text: Save Password?
        commands:
            - tapOn:
                    text: Not Now
            - waitForAnimationToEnd

# Go from Landing -> Login if needed.
- runFlow:
    when:
      visible:
        id: landing-login-button
    commands:
      - tapOn:
          id: landing-login-button
      - waitForAnimationToEnd

# Complete login when login form is visible.
- runFlow:
    when:
      visible:
        id: login-email-input
    commands:
      - tapOn:
          id: login-email-input
      - inputText: test-buyer@kidsmarketplace.test
      - tapOn:
          id: login-password-input
      - inputText: TestBuyer123!
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: login-submit-button
          direction: DOWN
      - tapOn:
          id: login-submit-button
      - waitForAnimationToEnd

# If primary credentials fail, retry once with alternate seeded credentials.
- runFlow:
    when:
      visible:
        text: Login Failed
    commands:
      - tapOn:
          text: OK
      - waitForAnimationToEnd
      - tapOn:
          id: login-email-input
      - eraseText
      - inputText: dev+user1@example.com
      - tapOn:
          id: login-password-input
      - eraseText
      - inputText: Password123!
      - hideKeyboard
      - tapOn:
          id: login-submit-button
      - waitForAnimationToEnd

# Complete onboarding only when presented.
- runFlow:
    when:
      visible:
        id: welcome-get-started-button
    commands:
      - tapOn:
          id: welcome-get-started-button
      - waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: onboarding-get-started-button
    commands:
      - tapOn:
          id: onboarding-get-started-button
      - waitForAnimationToEnd

# Navigate directly to SP Wallet via Expo deep-link route.
- openLink: exp://127.0.0.1:8081/--/sp-wallet
- waitForAnimationToEnd

# Wait until wallet screen is fully rendered.
- extendedWaitUntil:
        visible:
            id: sp-wallet-balance-card
        timeout: 120000

# TEST 1: SP Wallet Screen - Hero Balance Card
- assertVisible:
    id: sp-wallet-balance-card
- assertVisible:
    id: sp-wallet-balance-amount

# TEST 2: Quick Actions (updated labels)
- assertVisible:
    id: sp-wallet-shop-btn
- assertVisible:
    id: sp-wallet-sell-btn
- assertVisible:
    id: sp-wallet-history-btn
- assertVisible:
    text: Shop
- assertVisible:
    text: Sell
- assertVisible:
    text: History

# TEST 3: How to Earn (updated refer row)
- assertVisible:
    text: How to Earn SP
- assertVisible:
    id: sp-wallet-earn-sell-btn
- assertVisible:
    id: sp-wallet-earn-refer-btn
- assertVisible:
    text: Swap Points Expire

# TEST 4: Navigate to Transaction History
- tapOn:
    id: sp-wallet-history-btn
- waitForAnimationToEnd
- assertVisible:
    text: Transaction History
- assertVisible:
    id: sp-history-tab-all
- assertVisible:
    id: sp-history-tab-earned
- assertVisible:
    id: sp-history-tab-spent

# TEST 5: Empty or data state should render deterministically
- runFlow:
    when:
      visible:
        id: sp-history-empty-state
    commands:
      - assertVisible:
          text: No transactions yet

- runFlow:
    when:
      notVisible:
        id: sp-history-empty-state
    commands:
      - assertVisible:
          text: SP

# TEST 6: Tab filters
- tapOn:
    id: sp-history-tab-earned
- waitForAnimationToEnd
- assertVisible:
    id: sp-history-tab-earned

- tapOn:
    id: sp-history-tab-spent
- waitForAnimationToEnd
- assertVisible:
    id: sp-history-tab-spent

- tapOn:
    id: sp-history-tab-all
- waitForAnimationToEnd
- assertVisible:
    id: sp-history-tab-all

# TEST 7: Navigate back to wallet then profile
- tapOn:
    id: sp-history-back-button
- waitForAnimationToEnd
- assertVisible:
    id: sp-wallet-balance-card

- tapOn:
    id: sp-wallet-back-button
- waitForAnimationToEnd
- assertVisible:
    id: nav-profile
