# FLOW: trade-notifications
# Purpose: Trade notification E2E tests — login → Inbox tab → Verify inbox screen
# Covers: TC-G04 (TC-G01, TC-G02, TC-G03 are manual — push delivery not observable in simulator)

appId: com.sameralzubaidi.p2pmarketplace
---
- launchApp:
    clearState: false
- waitForAnimationToEnd
- runFlow: helpers/tfv2-login-buyer.yaml

# ── Login as buyer ──
- runFlow:
    when:
      visible:
        id: "login-email-input"
    commands:
      - tapOn:
          id: "login-email-input"
      - eraseText
      - inputText: "test-buyer@kidsmarketplace.test"
      # Tap twice: first tap dismisses iOS autofill, second focuses field
      - tapOn:
          id: "login-password-input"
      - tapOn:
          id: "login-password-input"
      - eraseText
      - inputText: "TestBuyer123!"
      # Tap submit button directly (keyboard dismisses automatically)
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd

# ── Navigate to Inbox tab ──
- tapOn:
    id: "tab-inbox"
- waitForAnimationToEnd

# ── Verify inbox screen ──
- waitForAnimationToEnd

- stopApp
