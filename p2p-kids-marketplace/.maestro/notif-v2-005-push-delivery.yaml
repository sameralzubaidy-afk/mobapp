---

# Test Case 9: Multiple Rapid Taps (Debounce Handling)
- runFlow:
    file: auth-login.yaml

- tapOn:
    id: "profile-tab"
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "settings-test-push-notification-button"
    direction: DOWN

# Tap button 3 times rapidly
- tapOn:
    id: "settings-test-push-notification-button"
- tapOn:
    id: "settings-test-push-notification-button"
- tapOn:
    id: "settings-test-push-notification-button"

# Only 1 alert should appear (first tap)
- waitForAnimationToEnd: 2000
- assertVisible:
    text: "Test Notification Sent ✅"
- tapOn: "OK"

# No additional alerts should appear
- waitForAnimationToEnd: 1000
# If second alert appears, test fails (manual verification required)

---

# FINALIZATION: Return to Home Screen
- tapOn:
    id: "home-tab"
- assertVisible: "Discover Items"
