# FLOW: Authentication & Session Management (FLOW-01)
# TASK: MODULE-15.1-UI-REDESIGN-FLOW-01
# States covered: Landing, Login UI, Login validation, Signup UI, Signup validation, Forgot Password, Suspended-session recovery
# Platform: iOS & Android (Expo Go)

appId: host.exp.exponent
---
# Reusable startup/state normalization
- runFlow:
    file: helpers/auth-bootstrap-expo.yaml

# Expo Go may bounce back to project home; reopen app deterministically.
- runFlow:
        when:
            visible:
                text: p2p-kids-marketplace
        commands:
            - tapOn:
                    text: p2p-kids-marketplace
            - waitForAnimationToEnd
            - openLink: exp://127.0.0.1:8081
            - waitForAnimationToEnd

# ============================================
# TC-MAESTRO-001: Landing Screen UI + Navigation
# ============================================
- runFlow:
    when:
      visible:
        id: landing-signup-button
    commands:
      - assertVisible:
          id: app-logo
      - assertVisible:
          id: landing-login-button
      - tapOn:
          id: landing-signup-button
      - waitForAnimationToEnd
      - assertVisible: Create Account
      - tapOn:
          id: signup-back-button
      - waitForAnimationToEnd
      - assertVisible:
          id: landing-login-button
      - tapOn:
          id: landing-login-button
      - waitForAnimationToEnd
      - assertVisible: Welcome Back!

- runFlow:
    when:
      visible:
        id: login-email-input
    commands:
      - assertVisible:
          id: login-submit-button

# ============================================
# TC-MAESTRO-002: Login Screen UI + Password Toggle
# ============================================

# Mid-flow crash recovery: recover from Expo "Something went wrong" before asserting login UI.
- runFlow:
    when:
      visible:
        text: Something went wrong.
    commands:
      - tapOn:
          point: "66%,62%"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: Something went wrong.
          commands:
            - openLink: exp://127.0.0.1:8081
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: p2p-kids-marketplace
          commands:
            - tapOn:
                text: p2p-kids-marketplace
            - waitForAnimationToEnd

# Ensure we are on the Login screen before asserting Login UI elements.
- runFlow:
    when:
      visible:
        id: landing-login-button
    commands:
      - tapOn:
          id: landing-login-button
      - waitForAnimationToEnd

# Assert Login screen elements only when on Login screen (prevents Expo-crash false failures).
- runFlow:
    when:
      visible:
        id: login-email-input
    commands:
      - assertVisible:
          id: login-email-input
      - assertVisible:
          id: login-password-input
      - assertVisible:
          id: login-password-input-toggle-button
      - assertVisible:
          id: login-submit-button
      - assertVisible:
          id: google-login-button
      - assertVisible:
          id: apple-login-button
      - assertVisible:
          id: facebook-login-button
      - tapOn:
          id: login-password-input
      - inputText: TestPass123
      - tapOn:
          id: login-password-input-toggle-button

# ============================================
# TC-MAESTRO-003: Login Validation States
# ============================================
# Run only when on Login screen (avoids eraseText DEADLINE_EXCEEDED on wrong screen)
- runFlow:
    when:
      visible:
        id: login-email-input
    commands:
      # Fields should be empty after fresh navigation; just dismiss keyboard and submit
      - tapOn:
          text: Welcome Back!
      - tapOn:
          id: login-submit-button
      - waitForAnimationToEnd
      - assertVisible: Email is required
      - assertVisible: Password is required
      # Now type an invalid email to test format validation
      - tapOn:
          id: login-email-input
      - inputText: notanemail
      - tapOn:
          id: login-password-input
      - inputText: AnyPassword1
      - tapOn:
          text: Welcome Back!
      - tapOn:
          id: login-submit-button
      - waitForAnimationToEnd
      - assertVisible: Email is invalid

# ============================================
# TC-MAESTRO-004 + 005 + 006: Signup Screen, Validation & Forgot Password
# All signup/forgot-password steps run inside a single conditional block gated
# on login-signup-link being visible, to avoid timing races between navigation
# and assertion.
# ============================================
- runFlow:
    when:
      visible:
        id: login-signup-link
    commands:
      # Navigate to Signup screen
      - tapOn:
          id: login-signup-link
      - waitForAnimationToEnd

      # Dismiss credential-save sheet if shown
      - runFlow:
          when:
            visible:
              text: Save Password?
          commands:
            - tapOn:
                text: Not Now
            - waitForAnimationToEnd

      # Recover from Expo crash mid-navigation
      - runFlow:
          when:
            visible:
              text: Something went wrong.
          commands:
            - tapOn:
                point: "66%,62%"
            - waitForAnimationToEnd

      # Wait for signup screen to fully render before asserting
      - extendedWaitUntil:
          visible:
            id: signup-display-name-input
          timeout: 30000

      # TC-MAESTRO-004: Signup UI assertions
      - assertVisible:
          id: signup-display-name-input
      - assertVisible:
          id: signup-email-input
      - assertVisible:
          id: signup-phone-input
      - swipe:
          direction: up
      - assertVisible:
          id: signup-dob-picker-day
      - assertVisible:
          id: signup-password-input
      - assertVisible:
          id: signup-confirm-password-input
      - assertVisible:
          id: signup-password-input-toggle-button
      - assertVisible:
          id: signup-confirm-password-input-toggle-button
      - assertVisible:
          id: signup-submit-button
      - tapOn:
          id: signup-password-input
      - inputText: TestPass123
      - tapOn:
          id: signup-password-input-toggle-button

      # TC-MAESTRO-005: Signup Validation
      - tapOn:
          id: signup-password-input
      - eraseText: 25
      - tapOn:
          id: signup-confirm-password-input
      - eraseText: 25
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: signup-submit-button
          direction: DOWN
      - tapOn:
          id: signup-submit-button
      - waitForAnimationToEnd
      - assertVisible:
          id: signup-password-input

      # TC-MAESTRO-006: Navigate back to Login for Forgot Password test
      - swipe:
          direction: down
      - swipe:
          direction: down
      - tapOn:
          id: signup-back-button
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: Save Password?
          commands:
            - tapOn:
                text: Not Now
            - waitForAnimationToEnd

      # Forgot Password test (now on Login screen)
      - extendedWaitUntil:
          visible:
            id: login-email-input
          timeout: 15000
      - tapOn:
          text: Forgot Password?
      - waitForAnimationToEnd
      - assertVisible: Forgot Password?
      - assertVisible:
          text: Send Reset Link
      - tapOn:
          text: you@example.com
      - inputText: notvalid
      - tapOn:
          text: Forgot Password?
      - tapOn:
          text: Send Reset Link
      - waitForAnimationToEnd
      - assertVisible: Invalid Email
      - tapOn: OK
      - tapOn:
          text: Back to Login
      - waitForAnimationToEnd

# Hard postcondition: back on stable login state
- runFlow:
    when:
      visible:
        id: login-email-input
    commands:
      - assertVisible:
          id: login-email-input
      - assertVisible:
          id: login-password-input
