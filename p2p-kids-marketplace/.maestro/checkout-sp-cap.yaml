# FLOW: checkout-sp-cap
# Purpose: SP cap and gated checkout tests — Discover → Item Detail → Check SP chip → Profile → SP Wallet
# Covers: TC-C07, TC-C08

appId: com.sameralzubaidi.p2pmarketplace
---
- launchApp:
    clearState: false
- waitForAnimationToEnd

# ── Step 1: Seed a test listing (login as seller, create item) ──
- runFlow: helpers/tfv2-login-seller.yaml
- runFlow: helpers/tfv2-seed-listing.yaml

# ── Step 2: Stop app and restart as buyer ──
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- runFlow: helpers/tfv2-login-buyer.yaml

# ── Login as buyer ──
- runFlow:
    when:
      visible:
        id: "login-email-input"
    commands:
      - tapOn:
          id: "login-email-input"
      - eraseText
      - inputText: "test-buyer@kidsmarketplace.test"
      # Tap twice: first tap dismisses iOS autofill, second focuses field
      - tapOn:
          id: "login-password-input"
      - tapOn:
          id: "login-password-input"
      - eraseText
      - inputText: "TestBuyer123!"
      # Tap submit button directly (keyboard dismisses automatically)
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd

# ── Navigate to Discover tab ──
- tapOn:
    id: "tab-discover"
- waitForAnimationToEnd

# ── Verify discover screen loaded ──
- assertVisible:
    id: "discover-results-list"
- waitForAnimationToEnd

# ── Tap first listing card (should exist after seeding) ──
- tapOn:
    id: "search-result-"
    index: 0
- waitForAnimationToEnd

# ── Verify item detail screen loaded ──
- assertVisible:
    id: "item-detail-title"
- assertVisible:
    id: "item-detail-price"
- assertVisible:
    id: "request-to-buy-button"
- waitForAnimationToEnd

# ── Check for Use SP locked chip (free user) ──
- runFlow:
    when:
      visible:
        id: "use-sp-locked-chip"
    commands:
      - assertVisible:
          id: "use-sp-locked-chip"

# ── Navigate to Me tab ──
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- waitForAnimationToEnd

# ── Verify SP balance stat on profile ──
- runFlow:
    when:
      visible:
        id: "profile-sp-balance-stat"
    commands:
      - assertVisible:
          id: "profile-sp-balance-stat"

- stopApp
