# FLOW: Checkout SP Cap Enforcement | TASK: ADMIN-V3-007 | States covered: sp_within_limit, sp_exceeds_limit

appId: com.kidsp2p.marketplace
---

# Preconditions: User must be logged in with Kids Club+ subscription and have SP in wallet

- launchApp

# Login (assuming test user credentials)
- tapOn: "Login"
- tapOn:
    id: "email-input"
- inputText: "test_subscriber@example.com"
- tapOn:
    id: "password-input"
- inputText: "TestPassword123!"
- tapOn: "Sign In"
- waitForAnimationToEnd: 2000

# Navigate to an item to purchase
- tapOn: "Browse"
- tapOn:
    index: 0 # First item in list

# Initiate trade
- tapOn: "Buy Now"

# Wait for checkout screen
- waitForAnimationToEnd: 1000

# STATE 1: Verify SP input is capped by category
# Try to enter SP amount beyond the max
- tapOn:
    id: "sp-input"
- clearText
- inputText: "9999" # Intentionally high amount

# Wait for validation
- waitForAnimationToEnd: 500

# STATE 2: Verify cap enforcement - should show error or auto-cap the value
# The screen should either:
# - Show an alert about SP limit exceeded
# - Auto-cap the input to the maximum allowed

# Verify SP amount is not > max_spend_sp for the category
# (This is enforced by the calculateCategorySP logic in TradeInitiationScreen)
- assertVisible:
    text: "SP Limit Exceeded"
    enabled: false # Should show error modal
OR:
- assertNotVisible:
    id: "confirm-purchase-button"
    enabled: true # Button should be disabled if SP > max

# Final assertion: User cannot proceed with excessive SP
- assertVisible:
    id: "sp-input"
    enabled: true
