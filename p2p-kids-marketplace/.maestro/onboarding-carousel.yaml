# FLOW: EDU-004-Onboarding-Carousel | TASK: EDU-004 | States covered: new-user, skip, complete
# MODULE-18 V1 EDU-004: Onboarding Carousel Maestro Flow Test
#
# Prerequisites:
# - Fresh test user with no onboarding flags set
# - Supabase staging environment ready
# - Education sections seed data loaded
#
# States Tested:
# 1. New user sees carousel
# 2. Swipe navigation works
# 3. Progress dots update
# 4. Skip button navigates to Home
# 5. Get Started completes onboarding and navigates to Home
#
# Success Criteria:
# - All 5 screens visible via swipe
# - Progress dots match current screen
# - Skip exits immediately
# - Get Started on screen 5 exits to Home
# - Reopening app does NOT show carousel

appId: com.p2pkidsmarketplace

---

# Test 1: New User - Complete Onboarding (Happy Path)
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Should show onboarding carousel (not Home dashboard)
- assertVisible:
    id: "onboarding-carousel"

# Screen 1: Welcome
- assertVisible:
    text: "Welcome to P2P Kids Marketplace!"
- assertVisible:
    id: "skip-button"
- assertVisible:
    id: "progress-dot-0"

# Swipe to Screen 2: Swap Points Definition
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- assertVisible:
    text: "What are Swap Points?"
- assertVisible:
    id: "progress-dot-1"

# Swipe to Screen 3: Earning SP
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- assertVisible:
    text: "How You Earn SP"
- assertVisible:
    id: "progress-dot-2"

# Swipe to Screen 4: Spending SP
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- assertVisible:
    text: "How You Spend SP"
- assertVisible:
    id: "progress-dot-3"

# Swipe to Screen 5: Safety
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- assertVisible:
    text: "Safety First!"
- assertVisible:
    id: "progress-dot-4"

# Get Started button should be visible on last screen
- assertVisible:
    id: "get-started-button"
- tapOn:
    id: "get-started-button"
- waitForAnimationToEnd

# Should navigate to Home dashboard
- assertVisible:
    text: "Home" # Dashboard heading or tab label

# Relaunch app to verify onboarding does NOT show again
- stopApp
- launchApp
- waitForAnimationToEnd

# Should go directly to Home (no carousel)
- assertVisible:
    text: "Home"
- assertNotVisible:
    id: "onboarding-carousel"

---

# Test 2: New User - Skip Onboarding
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Should show onboarding carousel
- assertVisible:
    id: "onboarding-carousel"

# Tap Skip button on first screen
- assertVisible:
    id: "skip-button"
- tapOn:
    id: "skip-button"
- waitForAnimationToEnd

# Should navigate to Home dashboard immediately
- assertVisible:
    text: "Home"
- assertNotVisible:
    id: "onboarding-carousel"

# Relaunch app to verify onboarding does NOT show again
- stopApp
- launchApp
- waitForAnimationToEnd

# Should go directly to Home (no carousel)
- assertVisible:
    text: "Home"
- assertNotVisible:
    id: "onboarding-carousel"

---

# Test 3: Swipe Navigation (Back and Forward)
- launchApp:
    clearState: true
- waitForAnimationToEnd

- assertVisible:
    id: "onboarding-carousel"

# Swipe forward to screen 2
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- assertVisible:
    id: "progress-dot-1"

# Swipe back to screen 1
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- assertVisible:
    id: "progress-dot-0"
- assertVisible:
    text: "Welcome to P2P Kids Marketplace!"

# Verify Skip button still works after navigation
- tapOn:
    id: "skip-button"
- waitForAnimationToEnd
- assertVisible:
    text: "Home"

---

# Test 4: Accessibility - Screen Announcements
# Note: This test requires screen reader support in Maestro
# Currently included as a manual verification step

# Manual Test Steps:
# 1. Enable VoiceOver (iOS) / TalkBack (Android)
# 2. Launch app with fresh user
# 3. Verify each screen announces: "Onboarding, step N of 5, <title>"
# 4. Verify Skip button announces: "Skip onboarding"
# 5. Verify Get Started button announces: "Get Started"
