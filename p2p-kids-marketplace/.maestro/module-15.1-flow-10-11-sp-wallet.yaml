# FLOW: SP Wallet & Transaction History | TASK: MODULE-15.1 FLOW-10/11 | States covered: Loaded, Empty, With Transactions, Tab Filtering

appId: com.p2pkidsmarketplace.app
name: MODULE-15.1 FLOW-10/11 - SP Wallet & Transaction History

---
# ========================================
# PRECONDITIONS: User logged in with SP wallet
# ========================================

- launchApp
- waitForAnimationToEnd: 2000

# Ensure user is logged in (if not, login first)
- assertVisible:
    id: "bottom-nav-profile"
- tapOn:
    id: "bottom-nav-profile"
- waitForAnimationToEnd: 1000

# Navigate to SP Wallet from Profile
- assertVisible:
    text: "Swap Points"
- tapOn:
    text: "Swap Points"
- waitForAnimationToEnd: 1500

# ========================================
# TEST 1: SP Wallet Screen - Hero Balance Card
# ========================================

- assertVisible:
    id: "sp-wallet-balance-card"
- assertVisible:
    text: "Swap Points"

# Verify balance amount is displayed (any number)
- assertVisible:
    id: "sp-wallet-balance-amount"

# Verify quick action buttons are present
- assertVisible:
    id: "sp-wallet-redeem-btn"
- assertVisible:
    id: "sp-wallet-earn-more-btn"
- assertVisible:
    id: "sp-wallet-history-btn"

# Verify action button labels
- assertVisible:
    text: "Redeem"
- assertVisible:
    text: "Earn More"
- assertVisible:
    text: "History"

# ========================================
# TEST 2: SP Wallet Screen - Lifetime Stats
# ========================================

- assertVisible:
    text: "How to Earn SP"

# Verify earn methods are displayed
- assertVisible:
    text: "Sell an item"
- assertVisible:
    text: "Complete a trade"
- assertVisible:
    text: "Refer a friend"

# Verify lifetime stats section
- assertVisible:
    text: "Total Earned"
- assertVisible:
    text: "Total Spent"
- assertVisible:
    text: "Pending"

# ========================================
# TEST 3: Navigate to Transaction History
# ========================================

- tapOn:
    id: "sp-wallet-history-btn"
- waitForAnimationToEnd: 1500

- assertVisible:
    text: "Transaction History"

# Verify tabs are present
- assertVisible:
    id: "sp-history-tab-all"
- assertVisible:
    id: "sp-history-tab-earned"
- assertVisible:
    id: "sp-history-tab-spent"

# ========================================
# TEST 4: Transaction History - All Tab (Default)
# ========================================

# State: With transactions
- runScript:
    when:
      visible: "No transactions yet"
    commands:
      - stopApp
      - assertVisible:
          id: "sp-history-empty-state"
      - assertVisible:
          text: "No transactions yet"

# State: Has transactions (happy path)
- runScript:
    when:
      not:
        visible: "No transactions yet"
    commands:
      # Verify at least one transaction is visible
      # Transaction rows don't have a generic testID, so we check for typical content
      - scroll

# ========================================
# TEST 5: Transaction History - Earned Tab
# ========================================

- tapOn:
    id: "sp-history-tab-earned"
- waitForAnimationToEnd: 500

# Earned tab should be active
- assertVisible:
    id: "sp-history-tab-earned"

# Verify filtering works (if transactions exist, they should show "+" prefix)
# Cannot reliably test without knowing exact transaction IDs
# UI-level validation only

# ========================================
# TEST 6: Transaction History - Spent Tab
# ========================================

- tapOn:
    id: "sp-history-tab-spent"
- waitForAnimationToEnd: 500

# Spent tab should be active
- assertVisible:
    id: "sp-history-tab-spent"

# Verify filtering works (if transactions exist, they should show "-" prefix)

# ========================================
# TEST 7: Transaction History - All Tab (Return)
# ========================================

- tapOn:
    id: "sp-history-tab-all"
- waitForAnimationToEnd: 500

# All tab should be active
- assertVisible:
    id: "sp-history-tab-all"

# ========================================
# TEST 8: Navigate Back to SP Wallet
# ========================================

- tapOn:
    id: "sp-history-back-button"
- waitForAnimationToEnd: 1000

# Should return to SP Wallet screen
- assertVisible:
    id: "sp-wallet-balance-card"

# ========================================
# TEST 9: Navigate Back from SP Wallet
# ========================================

- tapOn:
    id: "sp-wallet-back-button"
- waitForAnimationToEnd: 1000

# Should return to Profile screen
- assertVisible:
    text: "Profile"

# ========================================
# FINAL ASSERTION: Flow completed successfully
# ========================================

- assertVisible:
    text: "Swap Points"
