# FLOW: Draft Resume and FAB Bottom Sheet | TASK: LISTING-V3-007 | States covered: no drafts, has drafts, single item, bulk upload
appId: com.kidsmarketplace.p2p
tags:
  - listing
  - drafts
  - navigation
---

# LISTING-V3-007: Draft Resume Banner + FAB Bottom Sheet Flow

- launchApp:
    clearState: true

# State 1: Login as test user
- tapOn: "Log In"
- inputText: "test-listing-v3-007@example.com"
- tapOn: "Password"
- inputText: "Test123456!"
- tapOn: "Log In"
- waitForAnimationToEnd

# State 2: Navigate to Dashboard (Home)
- assertVisible: "Dashboard"
- waitForAnimationToEnd

# State 3: No drafts - Resume banner should NOT be visible
- assertNotVisible: 
    id: "resume-draft-banner"

# State 4: Navigate to My Listings
- tapOn: 
    id: "tab-profile"
- tapOn: "My Listings"
- waitForAnimationToEnd

# State 5: Verify Listings and Drafts tabs exist
- assertVisible:
    id: "tab-listings"
- assertVisible:
    id: "tab-drafts"

# State 6: Switch to Drafts tab - should be empty
- tapOn:
    id: "tab-drafts"
- waitForAnimationToEnd
- assertVisible: "No drafts yet"

# State 7: Open FAB bottom sheet
- tapOn:
    id: "fab-button"
- waitForAnimationToEnd
- assertVisible: "Create New Listing"
- assertVisible:
    id: "sheet-option-single"
- assertVisible:
    id: "sheet-option-bulk"

# State 8: Select "List One Item"
- tapOn:
    id: "sheet-option-single"
- waitForAnimationToEnd

# State 9: On ItemCreate screen - add a photo (simulated)
- assertVisible: "Add Photos"
# Note: In real test, would upload photo via expo-image-picker
# For now, simulate by directly navigating back

# State 10: Go back to Dashboard without completing
- tapOn:
    accessibilityLabel: "Back"
- waitForAnimationToEnd

# State 11: Draft should auto-save and banner should appear
- assertVisible:
    id: "resume-draft-banner"
- assertVisible:
    text: "1 unfinished listing"

# State 12: Tap Continue on banner
- tapOn:
    id: "resume-draft-banner-resume-button"
- waitForAnimationToEnd
# Should navigate back to ItemCreate with draft loaded
- assertVisible: "Add Photos"

# State 13: Go back again
- tapOn:
    accessibilityLabel: "Back"
- waitForAnimationToEnd

# State 14: Dismiss the banner
- assertVisible:
    id: "resume-draft-banner"
- tapOn:
    id: "resume-draft-banner-dismiss-button"
- waitForAnimationToEnd
# Banner should disappear (session-level dismiss)
- assertNotVisible:
    id: "resume-draft-banner"

# State 15: Navigate to My Listings > Drafts tab
- tapOn: 
    id: "tab-profile"
- tapOn: "My Listings"
- waitForAnimationToEnd
- tapOn:
    id: "tab-drafts"
- waitForAnimationToEnd

# State 16: Draft should be visible in list
- assertVisible:
    id: "draft-card-*"
    # Wildcard match since we don't know exact draft ID

# State 17: Resume draft from Drafts tab
- tapOn:
    id: "draft-resume-*"
- waitForAnimationToEnd
- assertVisible: "Add Photos"

# State 18: Go back and discard the draft
- tapOn:
    accessibilityLabel: "Back"
- waitForAnimationToEnd
- tapOn: "My Listings"
- tapOn:
    id: "tab-drafts"
- waitForAnimationToEnd

# State 19: Discard the draft
- tapOn:
    id: "draft-discard-*"
- waitForAnimationToEnd
- assertVisible: "Discard Draft"
- tapOn: "Discard"
- waitForAnimationToEnd

# State 20: Drafts list should be empty again
- assertVisible: "No drafts yet"

# State 21: Test Bulk Upload flow via FAB
- tapOn:
    id: "fab-button"
- waitForAnimationToEnd
- tapOn:
    id: "sheet-option-bulk"
- waitForAnimationToEnd
# Should navigate to BulkListingCreate
- assertVisible: "Bulk Upload"

# State 22: Go back - bulk draft should save
- tapOn:
    accessibilityLabel: "Back"
- waitForAnimationToEnd

# State 23: Return to Dashboard - banner should show for bulk draft
- tapOn: "Dashboard"
- waitForAnimationToEnd
- assertVisible:
    id: "resume-draft-banner"

# State 24: Verify banner leads to Bulk flow
- tapOn:
    id: "resume-draft-banner-resume-button"
- waitForAnimationToEnd
- assertVisible: "Bulk Upload"

# Final: Cleanup - discard all drafts
- tapOn:
    accessibilityLabel: "Back"
- tapOn: "My Listings"
- tapOn:
    id: "tab-drafts"
- waitForAnimationToEnd
# Discard all drafts (loop until empty - Maestro supports this)
- repeat:
    while:
      visible:
        id: "draft-card-*"
    commands:
      - tapOn:
          id: "draft-discard-*"
      - tapOn: "Discard"
      - waitForAnimationToEnd

# PASS: All assertions passed
