# Supabase configuration file
# File: supabase/config.toml

[functions.payout-settings-redirect]
verify_jwt = false

[functions.create-stripe-connect-account]
verify_jwt = false

# create-stripe-account-link is called from the mobile app with the user's JWT
# and the function enforces its own auth internally. Deployed state is
# verify_jwt=true (empirically probed 2026-08-27: gateway 401 on unauth
# request). MUST stay true — the CLI deploy reads this entry, so setting it
# false here would silently flip the gateway check off and break the auth
# boundary. (Re-applied 2026-08-27 after a concurrent commit reverted it.)
[functions.create-stripe-account-link]
verify_jwt = true

[functions.trade-payment]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# PayPal webhooks are delivered by PayPal servers with no Supabase JWT.
# MUST stay verify_jwt=false (verified deployed state 2026-08-27); the CLI deploy
# reads this entry, so without it a redeploy would flip the function to
# verify_jwt=true and reject all PayPal webhook events at the gateway.
[functions.paypal-webhook]
verify_jwt = false

[functions.stripe-webhook-subscriptions]
verify_jwt = false

[functions.cancel-trade]
verify_jwt = false

[functions.detach-payment-method]
verify_jwt = false

# release-payment is invoked server-to-server (cron / other functions) without a
# user JWT. MUST stay verify_jwt=false (verified deployed state 2026-08-27); the
# CLI deploy reads this entry, so without it a redeploy would flip the function
# to verify_jwt=true and break scheduled/serviced payment releases.
[functions.release-payment]
verify_jwt = false

[functions.send-offer-reminders]
verify_jwt = false

[functions.release-due-payouts]
verify_jwt = false

# dispatch-manual-payouts is invoked server-to-server: by the AFTER-INSERT DB
# trigger fn_queue_manual_payout_dispatch and by the hourly 'dispatch-manual-payouts'
# pg_cron job (both net.http_post with the service-role key). The handler itself
# requires the Authorization bearer to equal the service-role key, so this money
# path is never publicly invokable. MUST stay verify_jwt=false (Dev Task 124).
[functions.dispatch-manual-payouts]
verify_jwt = false

# R7 — Web-first subscription purchase: called by the consumer web app server
# (passitup.com) with the x-web-secret shared header OR a user JWT.
[functions.create-checkout-session]
verify_jwt = false

# purge-cache is an admin-only cache purge invoked server-to-server with an
# x-api-key header (the function enforces its own auth — no user JWT). Deployed
# state is verify_jwt=false (empirically probed 2026-08-27: an unauth request
# reaches the function body and returns its own 405/401, not a gateway 401).
# MUST stay false — without this entry the CLI deploy defaults to
# verify_jwt=true and a redeploy would flip the gateway check on and block
# admin cache purges.
[functions.purge-cache]
verify_jwt = false

# grace-period-cron is a server-to-server daily cron invoked by pg_cron job
# "grace-period-daily" via the SECURITY DEFINER invoke_grace_period_cron() RPC
# (net.http_post with the service-role key) — never by a user JWT. The original
# scheduling migration documented deploying it with --no-verify-jwt. MUST stay
# false: without this entry the CLI deploy defaults to verify_jwt=true, but the
# RPC sends a service-role bearer so the gateway still accepts it either way.
# DEV-TASK-98 (2026-09-03): entry added so config.toml represents the deployed
# intent instead of silently relying on the CLI default.
[functions.grace-period-cron]
verify_jwt = false


