<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stripe Setup Complete</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: white;
  border-radius: 20px;
  padding: 40px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.icon { font-size: 64px; margin-bottom: 20px; }
h1 { color: #10b981; font-size: 24px; margin-bottom: 12px; }
p { color: #666; font-size: 16px; line-height: 1.5; margin-bottom: 30px; }
.btn {
  display: inline-block;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 16px 32px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 600;
  font-size: 16px;
  border: none;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
</style>
</head>
<body>
<div class="card">
<div class="icon">✅</div>
<h1>Setup Complete!</h1>
<p>Your Stripe payout account has been set up successfully.</p>
<button class="btn" onclick="openApp()">Open Kids Marketplace App</button>
</div>
<script>
function openApp() {
  window.location.href = 'p2pkidsmarketplace://payout-settings?success=true';
  setTimeout(function() {
    window.location.href = 'https://kids-marketplace.com';
  }, 1000);
}
</script>
</body>
</html>
