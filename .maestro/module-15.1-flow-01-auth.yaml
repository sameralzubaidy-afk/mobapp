# FLOW: Authentication & Session Management (FLOW-01)
# TASK: MODULE-15.1-UI-REDESIGN-FLOW-01
# States covered: Landing, Login, Signup, Phone Verification, Forgot Password, Reset Password, Suspended Account
# Platform: iOS & Android

appId: com.kidsmarketplace.app
---

# ============================================
# TC-MAESTRO-001: Landing Screen UI & Navigation
# ============================================
- launchApp
- assertVisible: "Welcome to Pass It Up"
- assertVisible: "🤝"
- assertVisible: 
    text: "Buy, sell, and trade gently used kids' items locally"
- assertVisible:
    id: "landing-signup-button"
- assertVisible:
    id: "landing-login-button"

# Test navigation to Signup
- tapOn:
    id: "landing-signup-button"
- assertVisible: "Create Account"

# Go back to Landing
- back

# Test navigation to Login
- tapOn:
    id: "landing-login-button"
- assertVisible: "Log In"

# Go back to Landing
- back

# ============================================
# TC-MAESTRO-002: Login Screen UI Elements & Password Toggle
# ============================================
- tapOn:
    id: "landing-login-button"
- assertVisible: "Log In"
- assertVisible:
    id: "email-input"
- assertVisible:
    id: "password-input"
- assertVisible:
    id: "password-toggle-button"
- assertVisible:
    text: "Forgot password?"
- assertVisible:
    id: "login-submit-button"
- assertVisible:
    id: "social-login-buttons"

# Test password visibility toggle
- tapOn:
    id: "password-toggle-button"
# Eye icon should change (visual check)
- tapOn:
    id: "password-toggle-button"
# Eye icon should revert (visual check)

# Go back to Landing
- back

# ============================================
# TC-MAESTRO-003: Login Form Validation
# ============================================
- tapOn:
    id: "landing-login-button"
- assertVisible: "Log In"

# TC-003.1: Empty form submission
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd
# Alert should appear (cannot assert alert text in Maestro)

# TC-003.2: Invalid email format
- tapOn:
    id: "email-input"
- inputText: "notanemail"
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd
# Alert should appear

# TC-003.3: Valid email, empty password
- tapOn:
    id: "email-input"
- clearKeychain
- inputText: "test@example.com"
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd
# Alert should appear

# Go back to Landing
- back

# ============================================
# TC-MAESTRO-004: Signup Screen UI Elements
# ============================================
- tapOn:
    id: "landing-signup-button"
- assertVisible: "Create Account"
- assertVisible:
    id: "name-input"
- assertVisible:
    id: "email-input"
- assertVisible:
    id: "phone-input"
- assertVisible:
    id: "dob-input"
- assertVisible:
    id: "password-input"
- assertVisible:
    id: "confirm-password-input"
- assertVisible:
    id: "terms-checkbox"
- assertVisible:
    id: "signup-submit-button"
- assertVisible:
    id: "social-login-buttons"

# Test terms checkbox toggle
- tapOn:
    id: "terms-checkbox"
# Checkbox should show CheckSquare (green)
- tapOn:
    id: "terms-checkbox"
# Checkbox should show Square (gray)

# Go back to Landing
- back

# ============================================
# TC-MAESTRO-005: Signup Form Validation
# ============================================
- tapOn:
    id: "landing-signup-button"
- assertVisible: "Create Account"

# TC-005.1: Empty form submission
- tapOn:
    id: "signup-submit-button"
- waitForAnimationToEnd
# Alert should appear: "Name is required"

# TC-005.2: Name too short
- tapOn:
    id: "name-input"
- inputText: "A"
- tapOn:
    id: "signup-submit-button"
- waitForAnimationToEnd
# Alert should appear: "Name must be at least 2 characters"

# TC-005.3: Invalid email
- tapOn:
    id: "name-input"
- clearKeychain
- inputText: "John Doe"
- tapOn:
    id: "email-input"
- inputText: "notvalid"
- tapOn:
    id: "signup-submit-button"
- waitForAnimationToEnd
# Alert should appear: "Please enter a valid email address"

# TC-005.4: Weak password
- tapOn:
    id: "email-input"
- clearKeychain
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "abc"
- tapOn:
    id: "signup-submit-button"
- waitForAnimationToEnd
# Alert should appear: "Password must be at least 8 characters"

# TC-005.5: Password mismatch
- tapOn:
    id: "password-input"
- clearKeychain
- inputText: "Abc12345"
- tapOn:
    id: "confirm-password-input"
- inputText: "Abc12346"
- tapOn:
    id: "signup-submit-button"
- waitForAnimationToEnd
# Alert should appear: "Passwords do not match"

# TC-005.6: Invalid phone number
- tapOn:
    id: "password-input"
- clearKeychain
- inputText: "Abc12345"
- tapOn:
    id: "confirm-password-input"
- clearKeychain
- inputText: "Abc12345"
- tapOn:
    id: "phone-input"
- inputText: "123"
- tapOn:
    id: "signup-submit-button"
- waitForAnimationToEnd
# Alert should appear: "Please enter a valid phone number"

# TC-005.7: Terms not accepted
- tapOn:
    id: "phone-input"
- clearKeychain
- inputText: "+12345678901"
- tapOn:
    id: "dob-input"
- inputText: "1990-01-01"
# Ensure terms checkbox is unchecked
- tapOn:
    id: "signup-submit-button"
- waitForAnimationToEnd
# Alert should appear: "Please accept the Terms and Privacy Policy"

# Go back to Landing
- back

# ============================================
# TC-MAESTRO-006: Forgot Password Screen
# ============================================
- tapOn:
    id: "landing-login-button"
- assertVisible: "Log In"
- assertVisible:
    text: "Forgot password?"
- tapOn:
    text: "Forgot password?"
- assertVisible: "Forgot Password?"
- assertVisible:
    id: "email-input"
- assertVisible:
    id: "send-reset-button"

# TC-006.1: Empty email submission
- tapOn:
    id: "send-reset-button"
- waitForAnimationToEnd
# Alert should appear: "Please enter a valid email address"

# TC-006.2: Invalid email
- tapOn:
    id: "email-input"
- inputText: "notvalid"
- tapOn:
    id: "send-reset-button"
- waitForAnimationToEnd
# Alert should appear: "Please enter a valid email address"

# TC-006.3: Valid email (success state)
- tapOn:
    id: "email-input"
- clearKeychain
- inputText: "test@example.com"
- tapOn:
    id: "send-reset-button"
- waitForAnimationToEnd
# Success screen should appear
- assertVisible: "Check Your Email"
- assertVisible: "📧"

# Go back to Landing
- back
- back

# ============================================
# TC-MAESTRO-007: Suspended Account Screen (Simulated)
# ============================================
# NOTE: This test cannot be fully automated without a suspended test account
# Manual testing required for full suspended account flow
# Here we just verify the screen can be navigated to (if implemented in dev menu)

# Skip this test in automated runs - requires manual setup

# ============================================
# TC-MAESTRO-008: Design System Consistency Check
# ============================================
# This section verifies that all screens follow the design system
# by checking for consistent elements across screens

# Landing Screen
- launchApp
- assertVisible: "🤝"
# White background (visual check)
# Pill-shaped buttons (visual check)
# Green color #5DBB8E (visual check)

# Login Screen
- tapOn:
    id: "landing-login-button"
# Filled input style (visual check)
# No borders on inputs (visual check)
# Green forgot password link (visual check)
# Social login circles 50×50px (visual check)
- back

# Signup Screen
- tapOn:
    id: "landing-signup-button"
# Filled input style (visual check)
# Green checkbox when checked (visual check)
# Uppercase labels (visual check)
- back

# ============================================
# TC-MAESTRO-009: Social Login Buttons (UI Only)
# ============================================
- tapOn:
    id: "landing-login-button"
- assertVisible:
    id: "social-login-buttons"
- assertVisible:
    id: "google-login-button"
- assertVisible:
    id: "facebook-login-button"
- assertVisible:
    id: "apple-login-button"

# Note: Full OAuth flows cannot be automated via Maestro
# Tapping these buttons will trigger OAuth providers which are external
# Manual testing required for complete social login flows

# Tap Google button (will open OAuth modal - cannot automate further)
# - tapOn:
#     id: "google-login-button"
# User would see Google OAuth modal (external)

# End of automated flow
- back
