# FLOW: Phone Verification at First Listing | TASK: AUTH-V3-009 | States covered: unverified user blocked, verify, then proceed
# Tests deferred phone verification gate when user attempts to create first listing
#
# NOTE (2026-08-24): legacy Maestro flow — NOT referenced by test-automation/trade-flow-v2/manifest.json
# and its identifiers predate the current app (appId `com.p2pkids.marketplace` is not the bundle;
# `phone-input`/`send-code-button`/`modal-close-button`/`otp-input-N` don't exist on-device). Kept for
# reference only. The gate modal now renders the canonical single auto-formatted OTP field
# (design-system-passitup.md §4.4) as `listing-phone-verification-code` (testID = <modal testID>-code).

appId: com.p2pkids.marketplace

---
# Precondition: User signed up via social (no phone verified) and is logged in
- tapOn:
    id: "logout-button"
    optional: true
- assertVisible:
    id: "welcome-screen"
    optional: true

# Login with social-only user (no phone)
- tapOn:
    id: "login-button"
- assertVisible:
    id: "login-screen"
- tapOn:
    id: "social-login-google-button"
- inputText: "nophone@example.com"
    id: "google-email-input"
- tapOn:
    id: "google-sign-in-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000

---
# Step 1: Navigate to create listing screen
- tapOn:
    id: "sell-tab"
- assertVisible:
    id: "sell-screen"
- tapOn:
    id: "create-listing-button"
- assertVisible:
    id: "listing-create-screen"

---
# Step 2: Fill out listing details
- tapOn:
    id: "listing-title-input"
- inputText: "Test Item for Sale"
- tapOn:
    id: "listing-description-input"
- inputText: "This is a test item description"
- tapOn:
    id: "listing-price-input"
- inputText: "25"
- tapOn:
    id: "listing-category-select"
- tapOn:
    text: "Toys"

---
# Step 3: Tap "Publish" button
- tapOn:
    id: "publish-listing-button"
- waitForAnimationToEnd

---
# Step 4: Phone verification modal should appear (non-dismissible)
- assertVisible:
    id: "phone-verification-modal"
- assertVisible:
    text: "Verify Phone to Continue"
- assertVisible:
    id: "phone-input"
# Verify close button is NOT present (non-dismissible)
- assertNotVisible:
    id: "modal-close-button"

---
# Step 5: Enter phone number
- tapOn:
    id: "phone-input"
- inputText: "5551234567"
- assertVisible:
    text: "(555) 123-4567"
- tapOn:
    id: "send-code-button"
- waitForAnimationToEnd

---
# Step 6: OTP entry step should appear (single auto-formatted field, §4.4)
- assertVisible:
    text: "Enter verification code"
- assertVisible:
    id: "listing-phone-verification-code"

---
# Step 7: Enter 6-digit code in the single auto-formatted field
- tapOn:
    id: "listing-phone-verification-code"
- inputText: "123456"
- waitForAnimationToEnd

---
# Step 8: Modal should close and listing should be published
- assertNotVisible:
    id: "phone-verification-modal"
- assertVisible:
    text: "Listing published successfully"

---
# Step 9: Navigate back to my listings and verify item is listed
- tapOn:
    id: "my-listings-tab"
- assertVisible:
    text: "Test Item for Sale"

---
# Final assertion: Listing created after phone verification
- assertVisible:
    id: "my-listings-screen"
- assertVisible:
    text: "Test Item for Sale"
