# FLOW: Help Screen Education | TASK: EDU-005 | States covered: Default load, Deep link section, Pull-to-refresh, Calculator interaction, Section expansion

appId: com.p2pkidsmarketplace.app

---
# STATE 1: Default load - SP Definition expanded by default
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Navigate to Settings
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- tapOn:
    id: "settings-button"
- waitForAnimationToEnd

# Navigate to Help
- assertVisible:
    id: "settings-help-button"
- tapOn:
    id: "settings-help-button"
- waitForAnimationToEnd

# Verify Help screen loaded
- assertVisible:
    text: "How Trading Works"
- assertVisible:
    id: "help-screen"

# Verify SP Definition section is expanded by default
- assertVisible:
    id: "help-section-sp_definition-header"
- assertVisible:
    id: "help-section-sp_definition-content"

# Verify other sections exist but are collapsed
- assertVisible:
    id: "help-section-sp_earning-header"
- assertNotVisible:
    id: "help-section-sp_earning-content"

---
# STATE 2: Section expansion - tap to expand collapsed section
- tapOn:
    id: "help-section-sp_earning-header"
- waitForAnimationToEnd

# Verify section expanded
- assertVisible:
    id: "help-section-sp_earning-content"

# Verify content is visible
- assertVisible:
    text: "earn"
    # Content should contain text about earning SP

---
# STATE 3: Calculator interaction - fill price and category
- scrollUntilVisible:
    element:
      id: "help-sp-calculator"
    direction: DOWN
    timeout: 5000

- assertVisible:
    id: "help-sp-calculator"

# Enter price
- tapOn:
    id: "help-sp-calculator-price-input"
- inputText: "25.00"
- hideKeyboard

# Select category (LEGO Sets if available)
- tapOn:
    id: "help-sp-calculator-category-picker"
- tapOn:
    text: "LEGO Sets"
    # Falls back to first available category if LEGO not found

# Tap calculate
- tapOn:
    id: "help-sp-calculator-calculate-button"
- waitForAnimationToEnd

# Verify result displayed
- assertVisible:
    id: "help-sp-calculator-result"

---
# STATE 4: Bonus Categories section
- scrollUntilVisible:
    element:
      id: "help-bonus-categories"
    direction: DOWN
    timeout: 5000

- assertVisible:
    id: "help-bonus-categories"

# Verify at least one bonus category visible (if any exist)
- runFlow:
    when:
      visible:
        id: "help-bonus-categories-item-"
          # If bonus categories exist, verify their structure
    commands:
      - assertVisible:
          text: "Bonus Categories"

---
# STATE 5: Pull-to-refresh
- scroll:
    direction: UP
    # Scroll to top first

- extendedWaitUntil:
    visible:
      id: "help-section-sp_definition-header"

# Pull down to refresh
- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd:
    timeout: 3000

# Verify content reloaded (screen should still be visible)
- assertVisible:
    id: "help-screen"
- assertVisible:
    id: "help-section-sp_definition-header"

---
# STATE 6: Navigation - back button
- tapOn:
    id: "help-back-button"
- waitForAnimationToEnd

# Verify returned to Settings
- assertVisible:
    text: "Settings"
- assertVisible:
    id: "settings-help-button"

---
# FINAL ASSERTION: All states successfully executed
- assertTrue: true
