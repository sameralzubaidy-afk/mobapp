# FLOW: Set Password for Social-Only User | TASK: AUTH-V3-009 | States covered: social-only user adds password, can then email-login
# Tests password fallback: social-only user sets password and uses it for login

appId: com.p2pkids.marketplace

---
# Precondition: User signed up via Google only (no password)
- tapOn:
    id: "logout-button"
    optional: true
- assertVisible:
    id: "welcome-screen"

# Sign up with Google
- tapOn:
    id: "get-started-button"
- assertVisible:
    id: "signup-screen"
- tapOn:
    id: "social-login-google-button"
- inputText: "socialonlyuser@example.com"
    id: "google-email-input"
- tapOn:
    id: "google-sign-in-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000

---
# Step 1: Navigate to Settings > Linked Accounts
- tapOn:
    id: "profile-tab"
- assertVisible:
    id: "profile-screen"
- tapOn:
    id: "settings-button"
- assertVisible:
    id: "settings-screen"
- tapOn:
    id: "linked-accounts-menu-item"
- assertVisible:
    id: "linked-accounts-screen"

---
# Step 2: Verify current state (Google only, no password)
- assertVisible:
    id: "provider-card-google-linked"
- assertVisible:
    text: "Google"
- assertVisible:
    id: "add-password-button"
- assertNotVisible:
    id: "provider-card-email-linked"

---
# Step 3: Tap "Add Password" button
- tapOn:
    id: "add-password-button"
- assertVisible:
    id: "set-password-modal"
- assertVisible:
    text: "Set Password"

---
# Step 4: Enter new password (weak - should show error)
- tapOn:
    id: "new-password-input"
- inputText: "123"
- tapOn:
    id: "confirm-password-input"
- inputText: "123"
- tapOn:
    id: "set-password-button"
- assertVisible:
    text: "Password must be at least 8 characters"

---
# Step 5: Enter strong password
- tapOn:
    id: "new-password-input"
- clearText
- inputText: "SecurePass123!"
- tapOn:
    id: "confirm-password-input"
- clearText
- inputText: "SecurePass123!"
- tapOn:
    id: "set-password-button"
- waitForAnimationToEnd

---
# Step 6: Verify password set successfully
- assertNotVisible:
    id: "set-password-modal"
- assertVisible:
    text: "Password set successfully"
- assertVisible:
    id: "provider-card-email-linked"
- assertVisible:
    text: "Email & Password"

---
# Step 7: Logout
- tapOn:
    id: "back-button"
- tapOn:
    id: "back-button"
- tapOn:
    id: "logout-button"
- assertVisible:
    id: "welcome-screen"

---
# Step 8: Now login with EMAIL + PASSWORD (not Google)
- tapOn:
    id: "login-button"
- assertVisible:
    id: "login-screen"
- inputText: "socialonlyuser@example.com"
    id: "email-input"
- inputText: "SecurePass123!"
    id: "password-input"
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd

---
# Step 9: Verify email login succeeded
- assertVisible:
    id: "home-screen"
- assertVisible:
    id: "user-avatar"

---
# Step 10: Verify user profile loaded correctly
- tapOn:
    id: "profile-tab"
- assertVisible:
    id: "profile-screen"
- assertVisible:
    text: "Social Only User"

---
# Final assertion: User successfully set password and logged in via email
- assertVisible:
    id: "profile-screen"
# Verify user can now use BOTH Google and email+password to login
- tapOn:
    id: "settings-button"
- tapOn:
    id: "linked-accounts-menu-item"
- assertVisible:
    id: "provider-card-google-linked"
- assertVisible:
    id: "provider-card-email-linked"
