# FLOW: SP Calculator Widget Integration | TASK: EDU-006 | States covered: free, auto, legacy-checkout-tooltip
# Tests SPCalculator in Help + Sell and verifies legacy checkout SP tooltip behavior

appId: com.kidsmarketplace.app

---

# Prerequisite: User must be logged in and have at least one category seeded
- runFlow:
    file: ./auth-login.yaml
    env:
      TEST_EMAIL: test+calc@example.com
      TEST_PASSWORD: TestPass123!

---

# TEST 1: HelpScreen - Free Mode (no pre-fill, user selects everything)
- tapOn:
    testID: tab-more
- tapOn:
    testID: help-menu-item
- assertVisible:
    testID: help-screen
- assertVisible:
    testID: help-sp-calculator

# Verify free mode: empty state message
- assertVisible:
    testID: help-sp-calculator-empty-state
- assertVisible: "Select a category to see your SP"

# Select category
- tapOn:
    testID: help-sp-calculator-category-picker
- assertVisible:
    testID: help-sp-calculator-category-modal
- tapOn:
    text: "LEGO Sets"
    index: 0
- waitForAnimationToEnd

# Enter price
- tapOn:
    testID: help-sp-calculator-price-input
- inputText: "25.00"
- hideKeyboard

# Results should auto-appear (both panels)
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    testID: help-sp-calculator-sell-panel
- assertVisible:
    testID: help-sp-calculator-buy-panel
- assertVisible: "If You Sell:"
- assertVisible: "If You Buy:"

# Verify sell panel content
- assertVisible: "You'll earn:"
- assertVisible:
    text: ".*SP.*"
    regex: true

# Verify buy panel content
- assertVisible: "Max SP you can use:"
- assertVisible: "Cash you'll pay:"
- assertVisible: "Platform fee"
- assertVisible: "Total cost:"

# Change category (verify editable in free mode)
- tapOn:
    testID: help-sp-calculator-category-picker
- assertVisible:
    testID: help-sp-calculator-category-modal
- tapOn:
    text: "Books"
    index: 0
- waitForAnimationToEnd

# Verify results updated
- assertVisible:
    testID: help-sp-calculator-sell-panel
- assertVisible:
    testID: help-sp-calculator-buy-panel

---

# TEST 2: ItemCreateScreen - Auto Mode (pre-fills category, user can override)
- tapOn:
    testID: tab-sell
- tapOn:
    testID: create-item-button
- assertVisible:
    testID: item-create-screen

# Upload photo first (required before form appears)
- tapOn:
    testID: photo-upload-button
# Simulator: select photo from library
- tapOn: "Choose from Library"
- tapOn:
    index: 0
- waitForAnimationToEnd

# Select category
- tapOn:
    testID: category-select-button
- tapOn:
    text: "LEGO Sets"
    index: 0
- waitForAnimationToEnd

# Verify calculator appears with auto mode (category pre-filled)
- assertVisible:
    testID: item-create-sp-calculator
- assertVisible: "See Your Potential SP"

# Verify category is pre-filled (auto mode)
- assertVisible:
    testID: item-create-sp-calculator-category-picker
- assertVisible: "LEGO Sets"

# Enter price
- tapOn:
    testID: manual-price-input
- inputText: "30.00"
- hideKeyboard
- waitForAnimationToEnd

# Calculator should auto-update
- assertVisible:
    testID: item-create-sp-calculator-sell-panel
- assertVisible:
    testID: item-create-sp-calculator-buy-panel

# Verify user CAN change category (auto mode is editable)
- tapOn:
    testID: item-create-sp-calculator-category-picker
- assertVisible:
    testID: item-create-sp-calculator-category-modal
- tapOn:
    text: "Books"
    index: 0
- waitForAnimationToEnd

# Verify calculator updated to new category
- assertVisible:
    testID: item-create-sp-calculator-sell-panel

---

# TEST 3: TradeInitiationScreen - Legacy Checkout + SP Info Tooltip
# Prerequisite: Create a test item to purchase
- runFlow:
    file: ./create-test-item.yaml
    env:
      CATEGORY: LEGO Sets
      PRICE: 50.00

# Navigate to item detail and initiate trade
- tapOn:
    testID: tab-home
- tapOn:
    testID: item-card-0
- assertVisible:
    testID: item-detail-screen
- tapOn:
    testID: buy-now-button
- assertVisible:
    testID: trade-initiation-screen

# Verify legacy checkout sections exist and calculator is absent
- assertVisible: "Swap Points Discount"
- assertVisible: "Order Summary"
- assertNotVisible: "Understand Your Swap Points"
- assertNotVisible: "Calculate Your Swap Points"

# Verify SP info tooltip opens from info icon
- tapOn:
    testID: trade-sp-info-icon
- assertVisible:
    testID: trade-sp-info-tooltip
- assertVisible: "What are Swap Points (SP)?"
- assertVisible: "Got it"
- tapOn:
    text: "Got it"
- assertNotVisible:
    testID: trade-sp-info-tooltip

---

# TEST 4: Analytics verification
# Verify calculator_use event is tracked (check logs)
- runScript:
    label: "Verify analytics event tracked"
    script: |
      // In production, this would verify Supabase education_analytics table
      // For now, verify no crashes occurred during calculator usage
      maestro.assertTrue(true);

---

# FINAL ASSERTION: All 3 placements functional
- assertTrue: true
