# FLOW: Safety-004-Image-Moderation | TASK: SAFETY-004 | States covered: approved, flagged, error
# Prerequisites:
# - GOOGLE_VISION_API_KEY configured in Supabase Edge Function secrets
# - Migration 306 applied (ai_moderation_logs table)
# - item-images bucket exists (SAFETY-P001)
# - moderate-image function deployed

appId: com.kidsp2p.marketplace
---

# ========================================
# SETUP: Login and navigate to Create Listing
# ========================================
- launchApp
- tapOn: 
    id: "login-email-input"
- inputText: "test@example.com"
- tapOn:
    id: "login-password-input"
- inputText: "password123"
- tapOn:
    id: "login-submit-button"
- assertVisible:
    id: "home-screen"
    
- tapOn:
    id: "nav-tab-sell"
- assertVisible:
    id: "create-listing-screen"

# ========================================
# STATE 1: Upload image and verify moderation (Safe Image)
# ========================================
- tapOn:
    id: "listing-title-input"
- inputText: "Test Item - Safe Image"

- tapOn:
    id: "listing-description-input"
- inputText: "Testing Google Vision image moderation with safe image"

- tapOn:
    id: "listing-price-input"
- inputText: "25.00"

- tapOn:
    id: "listing-condition-picker"
- tapOn:
    text: "Good"

# Add image from gallery
- tapOn:
    id: "image-picker-button"
- waitForAnimationToEnd

# Select first image from gallery (this varies by platform)
- tapOn:
    index: 0  # First photo in gallery
- waitForAnimationToEnd: 2000

# Verify image appears in preview
- assertVisible:
    id: "image-preview-0"

# Submit listing
- tapOn:
    id: "create-listing-submit-button"
- waitForAnimationToEnd: 3000

# Should see success message
- assertVisible:
    id: "listing-created-success" 
    
# Navigate to My Listings to verify
- tapOn:
    id: "nav-tab-profile"
- assertVisible:
    id: "profile-screen"
    
- tapOn:
    id: "my-listings-button"
- assertVisible:
    id: "my-listings-screen"

# Verify listing is visible (not flagged)
- assertVisible:
    text: "Test Item - Safe Image"

# ========================================
# STATE 2: Verify moderation logs (Admin only - requires admin role)
# ========================================
# Note: This requires admin access and is typically done via admin portal
# Skipping UI flow for admin validation

# ========================================
# STATE 3: Error handling - Invalid image
# ========================================
- tapOn:
    id: "nav-tab-sell"
- assertVisible:
    id: "create-listing-screen"

- tapOn:
    id: "listing-title-input"
- inputText: "Test Item - Error Handling"

- tapOn:
    id: "listing-price-input"
- inputText: "15.00"

# Try to submit without image (should still work - images are optional)
- tapOn:
    id: "create-listing-submit-button"
- waitForAnimationToEnd: 2000

# Should see success even without images
- assertVisible:
    id: "listing-created-success"

# ========================================
# CLEANUP
# ========================================
# Note: Test listings will need manual cleanup or automated cleanup script
