# FLOW: MODULE-15.1-FLOW-02 Listings (Android)
# TASK: MODULE-15.1-UI-REDESIGN FLOW-02 ItemCreate Smoke

appId: host.exp.exponent
---

- launchApp
- openLink: exp://10.0.2.2:8081
- waitForAnimationToEnd

- runFlow:
    when:
      visible:
        text: p2p-kids-marketplace
    commands:
      - tapOn:
          text: p2p-kids-marketplace
      - waitForAnimationToEnd

- runFlow:
    when:
      visible:
        text: Save Password?
    commands:
      - tapOn:
          text: Not Now
      - waitForAnimationToEnd

- runFlow:
    when:
      visible:
        text: isn't responding
    commands:
      - tapOn: Wait
      - waitForAnimationToEnd

- openLink: exp://10.0.2.2:8081/--/create-item
- waitForAnimationToEnd

- runFlow:
    when:
      visible: Create Listing
    commands:
      - assertVisible:
          id: photo-upload-manager
      - assertVisible:
          id: add-photos-button
      - assertVisible:
          id: camera-icon-photo-slot
