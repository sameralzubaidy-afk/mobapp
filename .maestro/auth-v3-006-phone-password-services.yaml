# FLOW: Phone + Password Services | TASK: AUTH-V3-006 | States covered: phone-required, rate-limit, invalid-code, password-strength

appId: com.p2pkidsmarketplace

---

# Test Setup: Reset phone verification status
- runFlow:
    file: ./test-helpers/reset-phone-verification.yaml
    env:
      USER_ID: ${USER_ID}

---

# STATE 1: Phone verification required
- launchApp
- assertVisible: "Settings"
- tapOn: "Settings"
- assertVisible: "Phone Verification"
- assertVisible: "Not Verified"
- tapOn: "Verify Phone"

# Enter phone number
- assertVisible: 
    id: "phone-input"
- tapOn:
    id: "phone-input"
- inputText: "+15555550001"
- assertVisible: 
    id: "send-code-button"
- tapOn:
    id: "send-code-button"

# Wait for code sent confirmation
- waitForAnimationToEnd
- assertVisible: "Code sent"
- assertVisible:
    id: "otp-input"

---

# STATE 2: Invalid OTP code
- tapOn:
    id: "otp-input"
- inputText: "000000"
- tapOn:
    id: "verify-otp-button"
- waitForAnimationToEnd
- assertVisible: "Invalid code"

---

# STATE 3: Max attempts (retry 2 more times)
- tapOn:
    id: "otp-input"
- clearKeychain
- inputText: "111111"
- tapOn:
    id: "verify-otp-button"
- waitForAnimationToEnd
- assertVisible: "Invalid code"

- tapOn:
    id: "otp-input"
- clearKeychain
- inputText: "222222"
- tapOn:
    id: "verify-otp-button"
- waitForAnimationToEnd
- assertVisible: "Maximum attempts exceeded"

---

# STATE 4: Request new code
- assertVisible:
    id: "request-new-code-button"
- tapOn:
    id: "request-new-code-button"
- waitForAnimationToEnd
- assertVisible: "Code sent"

---

# STATE 5: Rate limit (send 3 more codes)
# Note: This requires rapid successive requests
- tapOn:
    id: "request-new-code-button"
- waitForAnimationToEnd
- tapOn:
    id: "request-new-code-button"
- waitForAnimationToEnd
- tapOn:
    id: "request-new-code-button"
- waitForAnimationToEnd

# 4th request should show rate limit
- tapOn:
    id: "request-new-code-button"
- waitForAnimationToEnd
- assertVisible: 
    text: "Too many attempts"

---

# STATE 6: Password strength validation (navigate to Set Password)
- back
- assertVisible: "Settings"
- tapOn: "Account Security"
- assertVisible: "Set Password"
- tapOn: "Set Password"

# Test TOO_SHORT
- assertVisible:
    id: "password-input"
- tapOn:
    id: "password-input"
- inputText: "short"
- tapOn:
    id: "set-password-button"
- waitForAnimationToEnd
- assertVisible: "8 characters"

# Test NO_DIGIT
- tapOn:
    id: "password-input"
- clearKeychain
- inputText: "NoDigitsHere"
- tapOn:
    id: "set-password-button"
- waitForAnimationToEnd
- assertVisible: "at least one digit"

# Test NO_LETTER
- tapOn:
    id: "password-input"
- clearKeychain
- inputText: "12345678"
- tapOn:
    id: "set-password-button"
- waitForAnimationToEnd
- assertVisible: "at least one letter"

# Test COMMON_PASSWORD
- tapOn:
    id: "password-input"
- clearKeychain
- inputText: "password123"
- tapOn:
    id: "set-password-button"
- waitForAnimationToEnd
- assertVisible: "too common"

# Test SUCCESS (strong password)
- tapOn:
    id: "password-input"
- clearKeychain
- inputText: "MySecurePass123!"
- tapOn:
    id: "set-password-button"
- waitForAnimationToEnd
- assertVisible: "Password set successfully"

---

# FINAL ASSERTION: User can now sign in with password
- back
- tapOn: "Sign Out"
- waitForAnimationToEnd
- assertVisible: "Sign In"
- assertVisible: 
    id: "email-input"
- tapOn:
    id: "email-input"
- inputText: "${TEST_USER_EMAIL}"
- tapOn:
    id: "password-input"
- inputText: "MySecurePass123!"
- tapOn:
    id: "sign-in-button"
- waitForAnimationToEnd
- assertVisible: "Dashboard"
